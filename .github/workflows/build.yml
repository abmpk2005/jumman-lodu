          // রিয়েল লুডু ইঞ্জিন স্ক্রিন (বোর্ড, ডাইস, ঘুঁটি ও এন্ট্রি ফি কাটাসহ)
          class RealLudoEngineScreen extends StatefulWidget {
            final double entryFee;
            final String userId;
            final String playerName;
            const RealLudoEngineScreen({super.key, required this.entryFee, required this.userId, required this.playerName});

            @override
            State<RealLudoEngineScreen> createState() => _RealLudoEngineScreenState();
          }

          class _RealLudoEngineScreenState extends State<RealLudoEngineScreen> with TickerProviderStateMixin {
            int _dice = 1;
            bool _rolling = false;
            int _turn = 0; // 0: Player (Yellow), 1: Opponent (Red)
            List<int> yellowPawns = [-1, -1, -1, -1];
            List<int> redPawns = [-1, -1, -1, -1];

            @override
            void initState() {
              super.initState();
              _deductFee();
            }

            Future<void> _deductFee() async {
              if (widget.entryFee <= 0) return;
              try {
                final sb = Supabase.instance.client;
                final w = await sb.from('wallet_accounts').select().eq('user_id', widget.userId).single();
                double cur = double.parse((w['balance'] ?? 0.0).toString());
                await sb.from('wallet_accounts').update({'balance': cur - widget.entryFee}).eq('user_id', widget.userId);
              } catch (_) {}
            }

            void _roll() {
              if (_rolling) return;
              setState(() => _rolling = true);
              Future.delayed(const Duration(milliseconds: 500), () {
                setState(() {
                  _dice = Random().nextInt(6) + 1;
                  _rolling = false;
                  if (_turn == 0) {
                    _movePawn(yellowPawns);
                    if (_dice != 6) { _turn = 1; Future.delayed(const Duration(milliseconds: 1000), () => _roll()); }
                  } else {
                    _movePawn(redPawns);
                    if (_dice != 6) { _turn = 0; } else { Future.delayed(const Duration(milliseconds: 1000), () => _roll()); }
                  }
                });
              });
            }

            void _movePawn(List<int> pawns) {
              for (int i = 0; i < 4; i++) {
                if (pawns[i] == -1 && _dice == 6) { pawns[i] = 0; break; }
                else if (pawns[i] >= 0 && pawns[i] < 57) { pawns[i] = min(57, pawns[i] + _dice); break; }
              }
            }

            @override
            Widget build(BuildContext context) {
              final size = MediaQuery.of(context).size.width;
              final step = size / 15.0;

              return Scaffold(
                appBar: AppBar(title: Text("ম্যাচ - ফি: ৳${widget.entryFee.toInt()}"), backgroundColor: const Color(0xFF4A0A3A)),
                body: Column(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(8.0),
                      child: Row(
                        children: [
                          const CircleAvatar(backgroundColor: Colors.red, radius: 12),
                          const SizedBox(width: 8),
                          Text("প্রতিপক্ষ (লাল দল) ${_turn == 1 ? '— চাল দিচ্ছে...' : ''}", style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ),
                    // রিয়েল লুডু বোর্ড (ঘুঁটি ও বোর্ড সহ)
                    Center(
                      child: SizedBox(
                        width: size, height: size,
                        child: CustomPaint(
                          painter: RealLudoBoardPainter(step: step, yellowPawns: yellowPawns, redPawns: redPawns),
                        ),
                      ),
                    ),
                    Container(
                      padding: const EdgeInsets.all(16),
                      color: const Color(0xFF1E293B),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Row(children: [const CircleAvatar(backgroundColor: Colors.amber, radius: 12), const SizedBox(width: 8), Text("${widget.playerName} (হলুদ) ${_turn == 0 ? '— আপনার চাল!' : ''}", style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold))]),
                          GestureDetector(
                            onTap: _turn == 0 ? _roll : null,
                            child: Container(
                              width: 60, height: 60,
                              decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.amber, width: 3)),
                              child: Center(child: _rolling ? const CircularProgressIndicator(color: Colors.amber) : Text("$_dice", style: const TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.black))),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class RealLudoBoardPainter extends CustomPainter {
            final double step;
            final List<int> yellowPawns;
            final List<int> redPawns;
            RealLudoBoardPainter({required this.step, required this.yellowPawns, required this.redPawns});

            @override
            void paint(Canvas canvas, Size size) {
              final p = Paint()..style = PaintingStyle.fill;
              canvas.drawRect(Rect.fromLTWH(0, 0, size.width, size.height), Paint()..color = Colors.white);

              // চার রঙের বেস
              p.color = const Color(0xFF1E88E5); // নীল (টপ-লেফট)
              canvas.drawRect(Rect.fromLTWH(0, 0, step * 6, step * 6), p);
              p.color = const Color(0xFFE53935); // লাল (টপ-রাইট)
              canvas.drawRect(Rect.fromLTWH(step * 9, 0, step * 6, step * 6), p);
              p.color = const Color(0xFFFBC02D); // হলুদ (বটম-লেফট)
              canvas.drawRect(Rect.fromLTWH(0, step * 9, step * 6, step * 6), p);
              p.color = const Color(0xFF2E7D32); // সবুজ (বটম-রাইট)
              canvas.drawRect(Rect.fromLTWH(step * 9, step * 9, step * 6, step * 6), p);

              void box(double x, double y, Color c) {
                canvas.drawRRect(RRect.fromRectAndRadius(Rect.fromLTWH(x + step * 0.8, y + step * 0.8, step * 4.4, step * 4.4), const Radius.circular(16)), Paint()..color = Colors.white);
                for (var pt in [Offset(x + step * 1.8, y + step * 1.8), Offset(x + step * 4.2, y + step * 1.8), Offset(x + step * 1.8, y + step * 4.2), Offset(x + step * 4.2, y + step * 4.2)]) {
                  canvas.drawCircle(pt, step * 0.65, Paint()..color = c.withOpacity(0.2));
                }
              }

              box(0, 0, const Color(0xFF1E88E5));
              box(step * 9, 0, const Color(0xFFE53935));
              box(0, step * 9, const Color(0xFFFBC02D));
              box(step * 9, step * 9, const Color(0xFF2E7D32));

              // হোম কলাম
              for (int r = 1; r <= 5; r++) { canvas.drawRect(Rect.fromLTWH(7 * step, r * step, step, step), Paint()..color = const Color(0xFFE53935)); }
              for (int r = 9; r <= 13; r++) { canvas.drawRect(Rect.fromLTWH(7 * step, r * step, step, step), Paint()..color = const Color(0xFFFBC02D)); }
              for (int c = 1; c <= 5; c++) { canvas.drawRect(Rect.fromLTWH(c * step, 7 * step, step, step), Paint()..color = const Color(0xFF1E88E5)); }
              for (int c = 9; c <= 13; c++) { canvas.drawRect(Rect.fromLTWH(c * step, 7 * step, step, step), Paint()..color = const Color(0xFF2E7D32)); }

              canvas.drawRect(Rect.fromLTWH(8 * step, 1 * step, step, step), Paint()..color = const Color(0xFFE53935));
              canvas.drawRect(Rect.fromLTWH(6 * step, 13 * step, step, step), Paint()..color = const Color(0xFFFBC02D));

              // গ্রিড বর্ডার
              final b = Paint()..style = PaintingStyle.stroke..color = Colors.black26..strokeWidth = 1.0;
              for (int r = 0; r < 15; r++) {
                for (int c = 0; c < 15; c++) {
                  canvas.drawRect(Rect.fromLTWH(c * step, r * step, step, step), b);
                }
              }

              // সেন্ট্রাল ট্রায়াঙ্গেল
              final cnt = Offset(step * 7.5, step * 7.5);
              canvas.drawPath(Path()..moveTo(step * 6, step * 6)..lineTo(step * 9, step * 6)..lineTo(cnt.dx, cnt.dy)..close(), Paint()..color = const Color(0xFFE53935));
              canvas.drawPath(Path()..moveTo(step * 6, step * 9)..lineTo(step * 9, step * 9)..lineTo(cnt.dx, cnt.dy)..close(), Paint()..color = const Color(0xFFFBC02D));
              canvas.drawPath(Path()..moveTo(step * 6, step * 6)..lineTo(step * 6, step * 9)..lineTo(cnt.dx, cnt.dy)..close(), Paint()..color = const Color(0xFF1E88E5));
              canvas.drawPath(Path()..moveTo(step * 9, step * 6)..lineTo(step * 9, step * 9)..lineTo(cnt.dx, cnt.dy)..close(), Paint()..color = const Color(0xFF2E7D32));

              // ঘুঁটি ড্র করা (পকেট বা বোর্ডে)
              void drawPawn(double x, double y, Color col) {
                canvas.drawCircle(Offset(x, y), step * 0.42, Paint()..color = col);
                canvas.drawCircle(Offset(x, y), step * 0.42, Paint()..style = PaintingStyle.stroke..color = Colors.white..strokeWidth = 2);
              }

              // হলুদ ঘুঁটি পজিশন
              for (int i = 0; i < 4; i++) {
                if (yellowPawns[i] == -1) {
                  List<Offset> yPockets = [Offset(step * 1.8, step * 10.8), Offset(step * 4.2, step * 10.8), Offset(step * 1.8, step * 13.2), Offset(step * 4.2, step * 13.2)];
                  drawPawn(yPockets[i].dx, yPockets[i].dy, Colors.amber.shade700);
                }
              }
              // লাল ঘুঁটি পজিশন
              for (int i = 0; i < 4; i++) {
                if (redPawns[i] == -1) {
                  List<Offset> rPockets = [Offset(step * 10.8, step * 1.8), Offset(step * 13.2, step * 1.8), Offset(step * 10.8, step * 4.2), Offset(step * 13.2, step * 4.2)];
                  drawPawn(rPockets[i].dx, rPockets[i].dy, Colors.red.shade700);
                }
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

