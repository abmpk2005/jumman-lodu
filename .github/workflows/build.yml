name: Build Jumman Ludo (Admin Live Fixed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Master App With Fixed Admin
        run: |
          flutter create --org com.jumman.ludo --project-name jumman_ludo .
          
          # ১. অ্যান্ড্রয়েড পারমিশন
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n<uses-permission android:name="android.permission.VIBRATE"/>\n<queries>\n<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n<package android:name="com.whatsapp"/>\n<package android:name="org.telegram.messenger"/>\n</queries>' android/app/src/main/AndroidManifest.xml

          # ২. ডিপেন্ডেন্সি কনফিগারেশন
          cat << 'EOF' > pubspec.yaml
          name: jumman_ludo
          description: "Jumman Ludo Complete App With Fixed Admin"
          publish_to: "none"
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            supabase_flutter: ^2.5.0
            google_fonts: ^6.1.0
            intl: ^0.19.0
            shared_preferences: ^2.2.3
            url_launcher: ^6.2.5
          flutter:
            uses-material-design: true
          EOF

          # ৩. সম্পূর্ণ গেম কোড (main.dart)
          cat << 'EOF' > lib/main.dart
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';

          const String supabaseUrl = 'https://tjagciqfcijvszqtsxhr.supabase.co';
          const String supabaseAnonKey = 'sb_publishable_jkd8rKF0gJHgml6kxmOxig_1mWaF7Sm';
          const String masterAdminPin = '7742';
          const String currentAppVersion = '1.0.0';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await Supabase.initialize(url: supabaseUrl, anonKey: supabaseAnonKey);
            } catch (_) {}
            runApp(const JummanLudoApp());
          }

          class JummanLudoApp extends StatelessWidget {
            const JummanLudoApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'jumman Ludo',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  textTheme: GoogleFonts.hindSiliguriTextTheme(ThemeData.dark().textTheme),
                  scaffoldBackgroundColor: const Color(0xFF2C0438),
                ),
                home: const SplashScreen(),
              );
            }
          }

          // ১. স্প্ল্যাশ স্ক্রিন
          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> {
            @override
            void initState() {
              super.initState();
              _checkSystemStatus();
            }

            Future<void> _checkSystemStatus() async {
              await Future.delayed(const Duration(seconds: 2));

              Map<String, dynamic>? config;
              try {
                final supabase = Supabase.instance.client;
                config = await supabase.from('app_config').select().eq('id', 1).maybeSingle();
              } catch (_) {}

              if (!mounted) return;

              if (config != null && config['is_maintenance'] == true) {
                final msg = config['maintenance_message'] ?? "সার্ভারের কাজ চলছে, কিছুক্ষণ পর আসুন।";
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => MaintenanceScreen(message: msg)));
                return;
              }

              if (config != null) {
                final latestVer = config['latest_version'] ?? '1.0.0';
                final downloadUrl = config['apk_download_url'] ?? 'https://github.com/abmpk2005/jumman-lodu';
                if (latestVer != currentAppVersion) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => UpdateScreen(downloadUrl: downloadUrl, latestVersion: latestVer)));
                  return;
                }
              }

              final prefs = await SharedPreferences.getInstance();
              final phone = prefs.getString('user_phone');
              if (phone != null && phone.isNotEmpty) {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone, config: config)));
              } else {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => LoginScreen(config: config)));
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  width: double.infinity,
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(colors: [Color(0xFF4A0A58), Color(0xFF1F0226)], begin: Alignment.topCenter, end: Alignment.bottomCenter),
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(shape: BoxShape.circle, boxShadow: [BoxShadow(color: Colors.amber.withOpacity(0.4), blurRadius: 40, spreadRadius: 10)]),
                        child: const Icon(Icons.casino, size: 100, color: Color(0xFFFFD700)),
                      ),
                      const SizedBox(height: 16),
                      ShaderMask(
                        shaderCallback: (bounds) => const LinearGradient(colors: [Color(0xFFFFDF00), Color(0xFFFF4500)]).createShader(bounds),
                        child: const Text("JUMMAN LUDO", style: TextStyle(fontSize: 34, fontWeight: FontWeight.w900, color: Colors.white, letterSpacing: 2)),
                      ),
                      const Text("★ MASTER EDITION ★", style: TextStyle(color: Colors.amberAccent, letterSpacing: 3, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 40),
                      const Padding(
                        padding: EdgeInsets.symmetric(horizontal: 50),
                        child: ClipRRect(
                          borderRadius: BorderRadius.all(Radius.circular(20)),
                          child: LinearProgressIndicator(minHeight: 10, backgroundColor: Color(0xFF3B0C46), color: Colors.greenAccent),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class UpdateScreen extends StatelessWidget {
            final String downloadUrl;
            final String latestVersion;
            const UpdateScreen({super.key, required this.downloadUrl, required this.latestVersion});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  padding: const EdgeInsets.all(24),
                  decoration: const BoxDecoration(gradient: LinearGradient(colors: [Color(0xFF8B125D), Color(0xFF240428)], begin: Alignment.topCenter, end: Alignment.bottomCenter)),
                  child: Center(
                    child: Container(
                      padding: const EdgeInsets.all(24),
                      decoration: BoxDecoration(color: const Color(0xFF3A0638), borderRadius: BorderRadius.circular(24), border: Border.all(color: Colors.amber, width: 3)),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Icon(Icons.system_update_rounded, size: 70, color: Colors.amber),
                          const SizedBox(height: 14),
                          const Text("নতুন আপডেট এসেছে!", style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.white)),
                          const SizedBox(height: 8),
                          Text("ভার্সন v$latestVersion", style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold)),
                          const SizedBox(height: 24),
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.greenAccent.shade700, foregroundColor: Colors.white, minimumSize: const Size(double.infinity, 50)),
                            icon: const Icon(Icons.download_rounded),
                            label: const Text("এখনই আপডেট করুন"),
                            onPressed: () async {
                              final uri = Uri.parse(downloadUrl);
                              if (await canLaunchUrl(uri)) launchUrl(uri, mode: LaunchMode.externalApplication);
                            },
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class MaintenanceScreen extends StatelessWidget {
            final String message;
            const MaintenanceScreen({super.key, required this.message});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  padding: const EdgeInsets.all(30),
                  color: const Color(0xFF1F0226),
                  child: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.construction_rounded, size: 80, color: Colors.amber),
                        const SizedBox(height: 20),
                        const Text("সার্ভার মেইনটেন্যান্স", style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.white)),
                        const SizedBox(height: 12),
                        Text(message, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white70, fontSize: 14)),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          // ২. লগইন স্ক্রিন
          class LoginScreen extends StatefulWidget {
            final Map<String, dynamic>? config;
            const LoginScreen({super.key, this.config});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _nameCtrl = TextEditingController();
            final _phoneCtrl = TextEditingController();
            bool _isLoading = false;

            Future<void> _login() async {
              final name = _nameCtrl.text.trim();
              final phone = _phoneCtrl.text.trim();
              if (name.isEmpty || phone.length < 11) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সঠিক নাম ও মোবাইল নম্বর দিন")));
                return;
              }

              setState(() => _isLoading = true);
              try {
                final supabase = Supabase.instance.client;
                final existing = await supabase.from('profiles').select().eq('phone_number', phone).maybeSingle();

                if (existing == null) {
                  final genId = "MIJU${Random().nextInt(8999) + 1000}";
                  final dummyUuid = '00000000-0000-0000-0000-${phone.substring(phone.length - 11)}';
                  await supabase.from('profiles').insert({
                    'id': dummyUuid,
                    'player_id': genId,
                    'full_name': name,
                    'phone_number': phone,
                  });
                  await supabase.from('wallet_accounts').insert({
                    'user_id': dummyUuid,
                    'balance': 50.0,
                  });
                }

                final prefs = await SharedPreferences.getInstance();
                await prefs.setString('user_phone', phone);
                await prefs.setString('user_name', name);

                if (mounted) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone, config: widget.config)));
                }
              } catch (e) {
                final prefs = await SharedPreferences.getInstance();
                await prefs.setString('user_phone', phone);
                await prefs.setString('user_name', name);
                if (mounted) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone, config: widget.config)));
                }
              } finally {
                if (mounted) setState(() => _isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(colors: [Color(0xFF4A0A58), Color(0xFF1D0322)], begin: Alignment.topCenter, end: Alignment.bottomCenter),
                  ),
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        children: [
                          const Icon(Icons.stars_rounded, size: 70, color: Colors.amber),
                          const SizedBox(height: 10),
                          const Text("লগইন / নিবন্ধন", style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.white)),
                          const SizedBox(height: 24),
                          TextField(
                            controller: _nameCtrl,
                            style: const TextStyle(color: Colors.white),
                            decoration: InputDecoration(hintText: "আপনার নাম", filled: true, fillColor: const Color(0xFF3D0947), border: OutlineInputBorder(borderRadius: BorderRadius.circular(16)), prefixIcon: const Icon(Icons.person, color: Colors.amber)),
                          ),
                          const SizedBox(height: 14),
                          TextField(
                            controller: _phoneCtrl,
                            keyboardType: TextInputType.phone,
                            style: const TextStyle(color: Colors.white),
                            decoration: InputDecoration(hintText: "মোবাইল নম্বর (১১ ডিজিট)", filled: true, fillColor: const Color(0xFF3D0947), border: OutlineInputBorder(borderRadius: BorderRadius.circular(16)), prefixIcon: const Icon(Icons.phone, color: Colors.amber)),
                          ),
                          const SizedBox(height: 24),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.amber.shade700, minimumSize: const Size(double.infinity, 50), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16))),
                            onPressed: _isLoading ? null : _login,
                            child: _isLoading ? const CircularProgressIndicator(color: Colors.white) : const Text("প্রবেশ করুন", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.black)),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // ৩. মূল ড্যাশবোর্ড
          class HomeScreen extends StatefulWidget {
            final String phone;
            final Map<String, dynamic>? config;
            const HomeScreen({super.key, required this.phone, this.config});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            double _balance = 0.0;
            String _name = "ভালো ছেলে";
            String _playerId = "MIJU7179";
            late String _supportNumber;
            late String _notice;

            @override
            void initState() {
              super.initState();
              _supportNumber = widget.config?['support_number'] ?? '01774229222';
              _notice = widget.config?['notice_text'] ?? 'জুমান লুডুতে স্বাগতম! নিয়মিত খেলুন এবং জিতে নিন পুরস্কার।';
              _loadData();
            }

            Future<void> _loadData() async {
              try {
                final supabase = Supabase.instance.client;
                final profile = await supabase.from('profiles').select().eq('phone_number', widget.phone).maybeSingle();
                if (profile != null) {
                  setState(() {
                    _name = profile['full_name'] ?? "ভালো ছেলে";
                    _playerId = profile['player_id'] ?? "MIJU7179";
                  });
                  final wallet = await supabase.from('wallet_accounts').select().eq('user_id', profile['id']).maybeSingle();
                  if (wallet != null) {
                    setState(() {
                      _balance = double.parse((wallet['balance'] ?? 0.0).toString());
                    });
                  }
                }
              } catch (_) {}
            }

            void _promptAdminPin() {
              final pinCtrl = TextEditingController();
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF4A0A3A),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                  title: const Text("অ্যাডমিন সিক্রেট পিন", style: TextStyle(color: Colors.amber)),
                  content: TextField(
                    controller: pinCtrl,
                    keyboardType: TextInputType.number,
                    obscureText: true,
                    maxLength: 4,
                    textAlign: TextAlign.center,
                    style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold, letterSpacing: 8, color: Colors.white),
                    decoration: const InputDecoration(hintText: "••••", filled: true, fillColor: Color(0xFF280222)),
                  ),
                  actions: [
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.amber),
                      onPressed: () {
                        if (pinCtrl.text.trim() == masterAdminPin) {
                          Navigator.pop(ctx);
                          Navigator.push(context, MaterialPageRoute(builder: (_) => const AdminScreen()));
                        } else {
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("ভুল পিন!")));
                        }
                      },
                      child: const Text("প্রবেশ", style: TextStyle(color: Colors.black)),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Column(
                    children: [
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                        child: Row(
                          children: [
                            CircleAvatar(radius: 18, backgroundColor: Colors.amberAccent, child: Text(_name.isNotEmpty ? _name[0] : 'J', style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold))),
                            const SizedBox(width: 8),
                            GestureDetector(
                              onTap: () async {
                                await Navigator.push(context, MaterialPageRoute(builder: (_) => WalletScreen(phone: widget.phone, balance: _balance, supportNumber: _supportNumber)));
                                _loadData();
                              },
                              child: Container(
                                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                                decoration: BoxDecoration(color: const Color(0xFF1D0322), borderRadius: BorderRadius.circular(20), border: Border.all(color: Colors.amber)),
                                child: Row(
                                  children: [
                                    const Icon(Icons.monetization_on, color: Colors.amber, size: 18),
                                    const SizedBox(width: 4),
                                    Text("৳ ${_balance.toStringAsFixed(0)}", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white, fontSize: 13)),
                                    const SizedBox(width: 4),
                                    const Icon(Icons.add_circle, color: Colors.greenAccent, size: 16),
                                  ],
                                ),
                              ),
                            ),
                            const Spacer(),
                            IconButton(icon: const Icon(Icons.security, color: Colors.amber), tooltip: "অ্যাডমিন", onPressed: _promptAdminPin),
                          ],
                        ),
                      ),
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                        color: const Color(0xFF35042D),
                        child: Text(_notice, style: const TextStyle(color: Colors.white70, fontSize: 12), overflow: TextOverflow.ellipsis),
                      ),
                      Expanded(
                        child: ListView(
                          padding: const EdgeInsets.all(16),
                          children: [
                            _buildBigCard("2 Player", "ক্লাসিক ব্যাটল (৳২০)", "2", const [Color(0xFFFF8C00), Color(0xFFFF512F)], 20.0),
                            const SizedBox(height: 16),
                            _buildBigCard("4 Player", "রয়্যাল ধামাকা (৳৫০)", "4", const [Color(0xFF8A2387), Color(0xFFE94057)], 50.0),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildBigCard(String title, String sub, String num, List<Color> colors, double fee) {
              return GestureDetector(
                onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => LudoGameScreen(entryFee: fee))),
                child: Container(
                  height: 120,
                  decoration: BoxDecoration(gradient: LinearGradient(colors: colors), borderRadius: BorderRadius.circular(20), border: Border.all(color: Colors.amber, width: 2)),
                  child: Center(child: Text("$title ($sub)", style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.white))),
                ),
              );
            }
          }

          // ৪. ওয়ালেট স্ক্রিন (সুপাবেসে সরাসরি ডেটা সেভ)
          class WalletScreen extends StatefulWidget {
            final String phone;
            final double balance;
            final String supportNumber;
            const WalletScreen({super.key, required this.phone, required this.balance, required this.supportNumber});
            @override
            State<WalletScreen> createState() => _WalletScreenState();
          }

          class _WalletScreenState extends State<WalletScreen> with SingleTickerProviderStateMixin {
            late TabController _tabCtrl;
            final _depAmt = TextEditingController();
            final _senderPhone = TextEditingController();
            final _trxId = TextEditingController();
            String _depMethod = 'BKASH';

            final _withAmt = TextEditingController();
            final _withPhone = TextEditingController();
            String _withMethod = 'BKASH';
            bool _loading = false;

            @override
            void initState() {
              super.initState();
              _tabCtrl = TabController(length: 2, vsync: this);
              _senderPhone.text = widget.phone;
              _withPhone.text = widget.phone;
            }

            Future<void> _submitDep() async {
              final amt = double.tryParse(_depAmt.text) ?? 0;
              final trx = _trxId.text.trim();
              if (amt < 10 || trx.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সঠিক পরিমাণ ও TrxID দিন")));
                return;
              }
              setState(() => _loading = true);
              try {
                final supabase = Supabase.instance.client;
                final dummyUuid = '00000000-0000-0000-0000-${widget.phone.substring(widget.phone.length - 11)}';
                
                await supabase.from('deposit_requests').insert({
                  'user_id': dummyUuid,
                  'amount': amt,
                  'payment_method': _depMethod,
                  'sender_number': _senderPhone.text,
                  'trx_id': trx,
                  'status': 'PENDING',
                });
                
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("ডিপোজিট অনুরোধ সফলভাবে অ্যাডমিন প্যানেলে পাঠানো হয়েছে!")));
                  Navigator.pop(context);
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("ত্রুটি: $e")));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            Future<void> _submitWith() async {
              final amt = double.tryParse(_withAmt.text) ?? 0;
              if (amt < 50 || amt > widget.balance) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সর্বনিম্ন ৫০ টাকা এবং ব্যালেন্সের সমান বা কম হতে হবে")));
                return;
              }
              setState(() => _loading = true);
              try {
                final supabase = Supabase.instance.client;
                final dummyUuid = '00000000-0000-0000-0000-${widget.phone.substring(widget.phone.length - 11)}';
                
                await supabase.from('withdrawal_requests').insert({
                  'user_id': dummyUuid,
                  'amount': amt,
                  'payment_method': _withMethod,
                  'receiver_number': _withPhone.text,
                  'status': 'PENDING',
                });
                
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("উত্তোলন অনুরোধ সফলভাবে অ্যাডমিন প্যানেলে পাঠানো হয়েছে!")));
                  Navigator.pop(context);
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("ত্রুটি: $e")));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text("ওয়ালেট ও লেনদেন"),
                  backgroundColor: const Color(0xFF4A0A3A),
                  bottom: TabBar(controller: _tabCtrl, indicatorColor: Colors.amber, tabs: const [Tab(text: "টাকা জমা"), Tab(text: "উত্তোলন")]),
                ),
                body: TabBarView(
                  controller: _tabCtrl,
                  children: [
                    SingleChildScrollView(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          Container(
                            padding: const EdgeInsets.all(14),
                            decoration: BoxDecoration(color: const Color(0xFF35042D), borderRadius: BorderRadius.circular(14), border: Border.all(color: Colors.amber)),
                            child: Column(
                              children: [
                                const Text("Send Money নম্বর (বিকাশ / নগদ পার্সোনাল):", style: TextStyle(color: Colors.white70)),
                                const SizedBox(height: 4),
                                Text(widget.supportNumber, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.amber)),
                              ],
                            ),
                          ),
                          const SizedBox(height: 16),
                          DropdownButtonFormField<String>(
                            value: _depMethod,
                            dropdownColor: const Color(0xFF35042D),
                            decoration: const InputDecoration(labelText: "পেমেন্ট মেথড", filled: true, fillColor: Color(0xFF35042D)),
                            items: const [DropdownMenuItem(value: 'BKASH', child: Text("বিকাশ")), DropdownMenuItem(value: 'NAGAD', child: Text("নগদ"))],
                            onChanged: (v) => setState(() => _depMethod = v!),
                          ),
                          const SizedBox(height: 10),
                          TextField(controller: _depAmt, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "টাকার পরিমাণ", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 10),
                          TextField(controller: _trxId, decoration: const InputDecoration(labelText: "Transaction ID (TrxID)", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 20),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, minimumSize: const Size(double.infinity, 48)),
                            onPressed: _loading ? null : _submitDep,
                            child: _loading ? const CircularProgressIndicator(color: Colors.black) : const Text("জমা অনুরোধ পাঠান", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                          ),
                        ],
                      ),
                    ),
                    SingleChildScrollView(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          TextField(controller: _withAmt, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "উত্তোলনের পরিমাণ", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 10),
                          TextField(controller: _withPhone, keyboardType: TextInputType.phone, decoration: const InputDecoration(labelText: "বিকাশ/নগদ নম্বর", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 20),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.greenAccent, minimumSize: const Size(double.infinity, 48)),
                            onPressed: _loading ? null : _submitWith,
                            child: _loading ? const CircularProgressIndicator(color: Colors.black) : const Text("উত্তোলন করুন", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          // ৫. সম্পূর্ণ ফিক্সড অ্যাডমিন প্যানেল (টাকা জমা + উত্তোলন দুটি লাইভ ট্যাব)
          class AdminScreen extends StatefulWidget {
            const AdminScreen({super.key});
            @override
            State<AdminScreen> createState() => _AdminScreenState();
          }

          class _AdminScreenState extends State<AdminScreen> with SingleTickerProviderStateMixin {
            late TabController _adminTabCtrl;

            @override
            void initState() {
              super.initState();
              _adminTabCtrl = TabController(length: 2, vsync: this);
            }

            @override
            Widget build(BuildContext context) {
              final supabase = Supabase.instance.client;
              return Scaffold(
                appBar: AppBar(
                  title: const Text("অ্যাডমিন ট্রানজেকশন কন্ট্রোল"),
                  backgroundColor: const Color(0xFF4A0A3A),
                  bottom: TabBar(
                    controller: _adminTabCtrl,
                    indicatorColor: Colors.amber,
                    tabs: const [
                      Tab(text: "জমা অনুরোধ (Deposits)"),
                      Tab(text: "উত্তোলন (Withdrawals)"),
                    ],
                  ),
                ),
                body: TabBarView(
                  controller: _adminTabCtrl,
                  children: [
                    // ট্যাব ১: লাইভ ডিপোজিট
                    StreamBuilder<List<Map<String, dynamic>>>(
                      stream: supabase.from('deposit_requests').stream(primaryKey: ['id']).eq('status', 'PENDING'),
                      builder: (context, snapshot) {
                        if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                        final list = snapshot.data!;
                        if (list.isEmpty) return const Center(child: Text("কোনো পেন্ডিং জমা অনুরোধ নেই!", style: TextStyle(color: Colors.white70)));

                        return ListView.builder(
                          itemCount: list.length,
                          itemBuilder: (context, i) {
                            final req = list[i];
                            return Card(
                              color: const Color(0xFF35042D),
                              margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12), side: const BorderSide(color: Colors.amber)),
                              child: ListTile(
                                title: Text("টাকা: ৳${req['amount']} (${req['payment_method']})", style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold, fontSize: 16)),
                                subtitle: Text("প্রেরক: ${req['sender_number']}\nTrxID: ${req['trx_id']}", style: const TextStyle(color: Colors.white70)),
                                trailing: Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.check_circle, color: Colors.greenAccent, size: 32),
                                      tooltip: "অনুমোদন করুন",
                                      onPressed: () async {
                                        await supabase.rpc('approve_deposit_transaction', params: {
                                          'p_req_id': req['id'],
                                          'p_user_id': req['user_id'],
                                          'p_amount': req['amount'],
                                        });
                                        if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("ডিপোজিট অনুমোদিত হয়েছে!")));
                                      },
                                    ),
                                    IconButton(
                                      icon: const Icon(Icons.cancel, color: Colors.redAccent, size: 32),
                                      tooltip: "বাতিল করুন",
                                      onPressed: () async {
                                        await supabase.from('deposit_requests').update({'status': 'REJECTED'}).eq('id', req['id']);
                                      },
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        );
                      },
                    ),

                    // ট্যাব ২: লাইভ উত্তোলন (Withdraw)
                    StreamBuilder<List<Map<String, dynamic>>>(
                      stream: supabase.from('withdrawal_requests').stream(primaryKey: ['id']).eq('status', 'PENDING'),
                      builder: (context, snapshot) {
                        if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                        final list = snapshot.data!;
                        if (list.isEmpty) return const Center(child: Text("কোনো পেন্ডিং উত্তোলন অনুরোধ নেই!", style: TextStyle(color: Colors.white70)));

                        return ListView.builder(
                          itemCount: list.length,
                          itemBuilder: (context, i) {
                            final req = list[i];
                            return Card(
                              color: const Color(0xFF35042D),
                              margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12), side: const BorderSide(color: Colors.blueAccent)),
                              child: ListTile(
                                title: Text("টাকা: ৳${req['amount']} (${req['payment_method']})", style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold, fontSize: 16)),
                                subtitle: Text("যে নম্বরে টাকা পাঠাবেন: ${req['receiver_number']}", style: const TextStyle(color: Colors.white70)),
                                trailing: Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.check_circle, color: Colors.greenAccent, size: 32),
                                      tooltip: "টাকা পাঠানো সম্পন্ন",
                                      onPressed: () async {
                                        await supabase.rpc('approve_withdrawal_transaction', params: {
                                          'p_req_id': req['id'],
                                          'p_user_id': req['user_id'],
                                          'p_amount': req['amount'],
                                        });
                                        if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("উত্তোলন সফলভাবে অনুমোদিত হয়েছে!")));
                                      },
                                    ),
                                    IconButton(
                                      icon: const Icon(Icons.cancel, color: Colors.redAccent, size: 32),
                                      tooltip: "বাতিল করুন",
                                      onPressed: () async {
                                        await supabase.from('withdrawal_requests').update({'status': 'REJECTED'}).eq('id', req['id']);
                                      },
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

          // ৬. লুডু বোর্ড স্ক্রিন
          class LudoGameScreen extends StatelessWidget {
            final double entryFee;
            const LudoGameScreen({super.key, required this.entryFee});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text("ম্যাচ - ফি: ৳${entryFee.toInt()}"), backgroundColor: const Color(0xFF4A0A3A)),
                body: const Center(
                  child: Text("লাইভ লুডু ম্যাচ শুরু হচ্ছে...", style: TextStyle(color: Colors.white, fontSize: 18)),
                ),
              );
            }
          }
          EOF

      - name: Build Fixed Admin Release APK
        run: flutter build apk --release

      - name: Upload Fixed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumman-ludo-admin-fixed
          path: build/app/outputs/flutter-apk/app-release.apk
