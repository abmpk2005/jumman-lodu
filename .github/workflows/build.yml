                    StreamBuilder<List<Map<String, dynamic>>>(
                      stream: sb.from('withdrawal_requests').stream(primaryKey: ['id']).eq('status', 'PENDING'),
                      builder: (ctx, s) {
                        if (!s.hasData) return const Center(child: CircularProgressIndicator());
                        final list = s.data!;
                        if (list.isEmpty) return const Center(child: Text("কোনো উত্তোলন নেই"));
                        return ListView.builder(itemCount: list.length, itemBuilder: (ctx, i) {
