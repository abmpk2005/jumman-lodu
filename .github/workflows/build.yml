          // ৪. ওয়ালেট স্ক্রিন
          class WalletScreen extends StatefulWidget {
            final String phone;
            final String userId;
            final double balance;
            final String supportNumber;
            const WalletScreen({super.key, required this.phone, required this.userId, required this.balance, required this.supportNumber});
            @override
            State<WalletScreen> createState() => _WalletScreenState();
          }

          class _WalletScreenState extends State<WalletScreen> with SingleTickerProviderStateMixin {
            late TabController _tabCtrl;
            final _depAmt = TextEditingController();
            final _senderPhone = TextEditingController();
            final _trxId = TextEditingController();
            String _depMethod = 'BKASH';

            final _withAmt = TextEditingController();
            final _withPhone = TextEditingController();
            String _withMethod = 'BKASH';
            bool _loading = false;

            @override
            void initState() {
              super.initState();
              _tabCtrl = TabController(length: 2, vsync: this);
              _senderPhone.text = widget.phone;
              _withPhone.text = widget.phone;
            }

            Future<void> _submitDep() async {
              final amt = double.tryParse(_depAmt.text) ?? 0;
              final trx = _trxId.text.trim();
              if (amt < 10 || trx.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সঠিক পরিমাণ ও TrxID দিন")));
                return;
              }
              setState(() => _loading = true);
              try {
                final supabase = Supabase.instance.client;
                await supabase.from('deposit_requests').insert({
                  'user_id': widget.userId,
                  'amount': amt,
                  'payment_method': _depMethod,
                  'sender_number': _senderPhone.text,
                  'trx_id': trx,
                  'status': 'PENDING',
                });
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("ডিপোজিট অনুরোধ সফলভাবে পাঠানো হয়েছে!")));
                  Navigator.pop(context);
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("ত্রুটি: $e")));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            Future<void> _submitWith() async {
              final amt = double.tryParse(_withAmt.text) ?? 0;
              if (amt < 50 || amt > widget.balance) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সর্বনিম্ন ৫০ টাকা এবং ব্যালেন্সের সমান বা কম হতে হবে")));
                return;
              }
              setState(() => _loading = true);
              try {
                final supabase = Supabase.instance.client;
                await supabase.from('withdrawal_requests').insert({
                  'user_id': widget.userId,
                  'amount': amt,
                  'payment_method': _withMethod,
                  'receiver_number': _withPhone.text,
                  'status': 'PENDING',
                });
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("উত্তোলন অনুরোধ সফলভাবে পাঠানো হয়েছে!")));
                  Navigator.pop(context);
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("ত্রুটি: $e")));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text("ওয়ালেট ও লেনদেন"),
                  backgroundColor: const Color(0xFF4A0A3A),
                  bottom: TabBar(controller: _tabCtrl, indicatorColor: Colors.amber, tabs: const [Tab(text: "টাকা জমা"), Tab(text: "উত্তোলন")]),
                ),
                body: TabBarView(
                  controller: _tabCtrl,
                  children: [
                    SingleChildScrollView(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          Container(
                            padding: const EdgeInsets.all(14),
                            decoration: BoxDecoration(color: const Color(0xFF35042D), borderRadius: BorderRadius.circular(14), border: Border.all(color: Colors.amber)),
                            child: Column(
                              children: [
                                const Text("Send Money নম্বর (বিকাশ / নগদ পার্সোনাল):", style: TextStyle(color: Colors.white70)),
                                const SizedBox(height: 4),
                                Text(widget.supportNumber, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.amber)),
                              ],
                            ),
                          ),
                          const SizedBox(height: 16),
                          DropdownButtonFormField<String>(
                            value: _depMethod,
                            dropdownColor: const Color(0xFF35042D),
                            decoration: const InputDecoration(labelText: "পেমেন্ট মেথড", filled: true, fillColor: Color(0xFF35042D)),
                            items: const [DropdownMenuItem(value: 'BKASH', child: Text("বিকাশ")), DropdownMenuItem(value: 'NAGAD', child: Text("নগদ"))],
                            onChanged: (v) => setState(() => _depMethod = v!),
                          ),
                          const SizedBox(height: 10),
                          TextField(controller: _depAmt, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "টাকার পরিমাণ", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 10),
                          TextField(controller: _trxId, decoration: const InputDecoration(labelText: "Transaction ID (TrxID)", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 20),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, minimumSize: const Size(double.infinity, 48)),
                            onPressed: _loading ? null : _submitDep,
                            child: _loading ? const CircularProgressIndicator(color: Colors.black) : const Text("জমা অনুরোধ পাঠান", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                          ),
                        ],
                      ),
                    ),
                    SingleChildScrollView(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          TextField(controller: _withAmt, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "উত্তোলনের পরিমাণ", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 10),
                          TextField(controller: _withPhone, keyboardType: TextInputType.phone, decoration: const InputDecoration(labelText: "বিকাশ/নগদ নম্বর", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 20),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.greenAccent, minimumSize: const Size(double.infinity, 48)),
                            onPressed: _loading ? null : _submitWith,
                            child: const Text("উত্তোলন করুন", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          // ৫. অ্যাডমিন প্যানেল (৩-ট্যাব)
          class AdminScreen extends StatefulWidget {
            const AdminScreen({super.key});
            @override
            State<AdminScreen> createState() => _AdminScreenState();
          }

          class _AdminScreenState extends State<AdminScreen> with SingleTickerProviderStateMixin {
            late TabController _adminTabCtrl;

            @override
            void initState() {
              super.initState();
              _adminTabCtrl = TabController(length: 3, vsync: this);
            }

            @override
            Widget build(BuildContext context) {
              final supabase = Supabase.instance.client;
              return Scaffold(
                appBar: AppBar(
                  title: const Text("অ্যাডমিন কন্ট্রোল"),
                  backgroundColor: const Color(0xFF4A0A3A),
                  bottom: TabBar(
                    controller: _adminTabCtrl,
                    indicatorColor: Colors.amber,
                    tabs: const [Tab(text: "জমা"), Tab(text: "উত্তোলন"), Tab(text: "খেলোয়াড়")],
                  ),
                ),
                body: TabBarView(
                  controller: _adminTabCtrl,
                  children: [
                    // জমা
                    StreamBuilder<List<Map<String, dynamic>>>(
                      stream: supabase.from('deposit_requests').stream(primaryKey: ['id']).eq('status', 'PENDING'),
                      builder: (context, snapshot) {
                        if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                        final list = snapshot.data!;
                        if (list.isEmpty) return const Center(child: Text("কোনো পেন্ডিং জমা অনুরোধ নেই!"));

                        return ListView.builder(
                          itemCount: list.length,
                          itemBuilder: (context, i) {
                            final req = list[i];
                            return Card(
                              color: const Color(0xFF35042D),
                              margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12), side: const BorderSide(color: Colors.amber)),
                              child: ListTile(
                                title: Text("৳${req['amount']} (${req['payment_method']})", style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                                subtitle: Text("প্রেরক: ${req['sender_number']}\nTrxID: ${req['trx_id']}"),
                                trailing: Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.check_circle, color: Colors.greenAccent, size: 30),
                                      onPressed: () async {
                                        await supabase.rpc('approve_deposit_transaction', params: {
                                          'p_req_id': req['id'],
                                          'p_user_id': req['user_id'].toString(),
                                          'p_amount': req['amount'],
                                        });
                                      },
                                    ),
                                    IconButton(
                                      icon: const Icon(Icons.cancel, color: Colors.redAccent, size: 30),
                                      onPressed: () async {
                                        await supabase.from('deposit_requests').update({'status': 'REJECTED'}).eq('id', req['id']);
                                      },
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        );
                      },
                    ),
                    // উত্তোলন
                    StreamBuilder<List<Map<String, dynamic>>>(
                      stream: supabase.from('withdrawal_requests').stream(primaryKey: ['id']).eq('status', 'PENDING'),
                      builder: (context, snapshot) {
                        if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                        final list = snapshot.data!;
                        if (list.isEmpty) return const Center(child: Text("কোনো পেন্ডিং উত্তোলন অনুরোধ নেই!"));

                        return ListView.builder(
                          itemCount: list.length,
                          itemBuilder: (context, i) {
                            final req = list[i];
                            return Card(
                              color: const Color(0xFF35042D),
                              margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12), side: const BorderSide(color: Colors.blueAccent)),
                              child: ListTile(
                                title: Text("টাকা: ৳${req['amount']}", style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold)),
                                subtitle: Text("নম্বর: ${req['receiver_number']}"),
                                trailing: Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.check_circle, color: Colors.greenAccent, size: 30),
                                      onPressed: () async {
                                        await supabase.rpc('approve_withdrawal_transaction', params: {
                                          'p_req_id': req['id'],
                                          'p_user_id': req['user_id'].toString(),
                                          'p_amount': req['amount'],
                                        });
                                      },
                                    ),
                                    IconButton(
                                      icon: const Icon(Icons.cancel, color: Colors.redAccent, size: 30),
                                      onPressed: () async {
                                        await supabase.from('withdrawal_requests').update({'status': 'REJECTED'}).eq('id', req['id']);
                                      },
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        );
                      },
                    ),
                    // খেলোয়াড় তালিকা
                    StreamBuilder<List<Map<String, dynamic>>>(
                      stream: supabase.from('profiles').stream(primaryKey: ['id']),
                      builder: (context, snapshot) {
                        if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                        final players = snapshot.data!;
                        return ListView.builder(
                          itemCount: players.length,
                          itemBuilder: (context, i) {
                            final p = players[i];
                            return Card(
                              color: const Color(0xFF35042D),
                              margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                              child: ListTile(
                                leading: CircleAvatar(backgroundColor: Colors.amber, child: Text(p['full_name'] != null && p['full_name'].toString().isNotEmpty ? p['full_name'][0] : 'P', style: const TextStyle(color: Colors.black))),
                                title: Text("${p['full_name']} (${p['player_id']})", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                                subtitle: Text("ফোন: ${p['phone_number']} | ম্যাচ: ${p['total_matches'] ?? 0} | জয়: ${p['matches_won'] ?? 0}", style: const TextStyle(color: Colors.white70)),
                              ),
                            );
                          },
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

          // ৬. আসল অথেনটিক প্রফেশনাল লুডু বোর্ড ও ইঞ্জিন
          class LudoBoardScreen extends StatefulWidget {
            final double entryFee;
            final String userId;
            final String phone;
            const LudoBoardScreen({super.key, required this.entryFee, required this.userId, required this.phone});

            @override
            State<LudoBoardScreen> createState() => _LudoBoardScreenState();
          }

          class _LudoBoardScreenState extends State<LudoBoardScreen> {
            int _dice = 1;
            bool _rolling = false;
            int _turn = 0; // 0: Red (Player), 1: Green (Opponent)

            // ৪টি করে ঘুঁটির পজিশন:
            // -1 মানে ঘরের পকেটে আছে
            // 0 থেকে 51 হলো সাধারণ বাইরের রাস্তা
            // 52 থেকে 56 হলো হোম কলাম
            // 57 হলো বিজয়ী ঘর
            List<int> redPawns = [-1, -1, -1, -1];
            List<int> greenPawns = [-1, -1, -1, -1];

            @override
            void initState() {
              super.initState();
              _deductEntryFee();
            }

            Future<void> _deductEntryFee() async {
              if (widget.entryFee <= 0) return;
              try {
                final supabase = Supabase.instance.client;
                final wallet = await supabase.from('wallet_accounts').select().eq('user_id', widget.userId).single();
                double cur = double.parse((wallet['balance'] ?? 0.0).toString());
                await supabase.from('wallet_accounts').update({'balance': cur - widget.entryFee}).eq('user_id', widget.userId);
              } catch (_) {}
            }

            void _rollDice() {
              if (_rolling) return;
              setState(() => _rolling = true);

              Future.delayed(const Duration(milliseconds: 500), () {
                setState(() {
                  _dice = Random().nextInt(6) + 1;
                  _rolling = false;

                  if (_turn == 0) {
                    _movePawn(redPawns);
                    if (_dice != 6) {
                      _turn = 1;
                      Future.delayed(const Duration(milliseconds: 1000), () => _rollDice());
                    }
                  } else {
                    _movePawn(greenPawns);
                    if (_dice != 6) {
                      _turn = 0;
                    } else {
                      Future.delayed(const Duration(milliseconds: 1000), () => _rollDice());
                    }
                  }
                });
              });
            }

            void _movePawn(List<int> pawns) {
              for (int i = 0; i < 4; i++) {
                if (pawns[i] == -1 && _dice == 6) {
                  pawns[i] = 0; // ঘর থেকে বের হওয়া
                  break;
                } else if (pawns[i] >= 0 && pawns[i] < 57) {
                  pawns[i] = min(57, pawns[i] + _dice);
                  break;
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.entryFee > 0 ? "ম্যাচ - ফি: ৳${widget.entryFee.toInt()}" : "ফ্রেন্ডলি ম্যাচ"),
                  backgroundColor: const Color(0xFF4A0A3A),
                ),
                body: SafeArea(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      // প্রতিপক্ষ প্লেয়ার বার
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                        color: const Color(0xFF35042D),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Row(
                              children: [
                                Container(
                                  padding: const EdgeInsets.all(2),
                                  decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: Colors.greenAccent, width: 2)),
                                  child: const CircleAvatar(radius: 16, backgroundColor: Colors.green, child: Icon(Icons.person, color: Colors.white, size: 20)),
                                ),
                                const SizedBox(width: 8),
                                Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    const Text("প্রতিপক্ষ (সবুজ দল)", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white, fontSize: 14)),
                                    Text(_turn == 1 ? "চালছেন..." : "অপেক্ষা করছেন", style: TextStyle(color: _turn == 1 ? Colors.greenAccent : Colors.white54, fontSize: 11)),
                                  ],
                                ),
                              ],
                            ),
                            if (_turn == 1) const SizedBox(width: 20, height: 20, child: CircularProgressIndicator(strokeWidth: 2, color: Colors.greenAccent)),
                          ],
                        ),
                      ),

                      // আসল প্রফেশনাল লুডু বোর্ড
                      Center(
                        child: Container(
                          width: MediaQuery.of(context).size.width - 16,
                          height: MediaQuery.of(context).size.width - 16,
                          decoration: BoxDecoration(
                            color: Colors.white,
                            borderRadius: BorderRadius.circular(16),
                            border: Border.all(color: Colors.amber, width: 4),
                            boxShadow: const [BoxShadow(color: Colors.black87, blurRadius: 15, offset: Offset(0, 6))],
                          ),
                          child: ClipRRect(
                            borderRadius: BorderRadius.circular(12),
                            child: CustomPaint(
                              painter: MasterLudoBoardPainter(redPawns: redPawns, greenPawns: greenPawns),
                            ),
                          ),
                        ),
                      ),

                      // নিজের প্লেয়ার কন্ট্রোল বার এবং আসল ডাইস
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 12),
                        decoration: const BoxDecoration(
                          color: Color(0xFF35042D),
                          borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                          boxShadow: [BoxShadow(color: Colors.black54, blurRadius: 8)],
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Row(
                              children: [
                                Container(
                                  padding: const EdgeInsets.all(2),
                                  decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: Colors.redAccent, width: 2)),
                                  child: const CircleAvatar(radius: 18, backgroundColor: Colors.red, child: Icon(Icons.person, color: Colors.white, size: 22)),
                                ),
                                const SizedBox(width: 10),
                                Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    const Text("আপনার চাল (লাল দল)", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white, fontSize: 15)),
                                    Text(_turn == 0 ? "👉 ছক্কায় ট্যাপ করুন!" : "প্রতিপক্ষের চাল", style: TextStyle(color: _turn == 0 ? Colors.amberAccent : Colors.white54, fontSize: 12, fontWeight: FontWeight.bold)),
                                  ],
                                ),
                              ],
                            ),
                            // ৩ডি ডাইস উইজেট
                            GestureDetector(
                              onTap: (_turn == 0 && !_rolling) ? _rollDice : null,
                              child: Container(
                                width: 62,
                                height: 62,
                                decoration: BoxDecoration(
                                  color: Colors.white,
                                  borderRadius: BorderRadius.circular(14),
                                  border: Border.all(color: _turn == 0 ? Colors.amber : Colors.grey, width: 3),
                                  boxShadow: [BoxShadow(color: _turn == 0 ? Colors.amber.withOpacity(0.5) : Colors.black45, blurRadius: 10, spreadRadius: 2)],
                                ),
                                child: Center(
                                  child: _rolling
                                      ? const SizedBox(width: 24, height: 24, child: CircularProgressIndicator(color: Colors.red, strokeWidth: 3))
                                      : CustomPaint(size: const Size(40, 40), painter: DiceDotsPainter(dots: _dice)),
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          // ৭. আসল আন্তর্জাতিক লুডু বোর্ড পেইন্টার (৪ হোম পকেট, স্টার জোন ও বিজয় ট্রায়াঙ্গেল)
          class MasterLudoBoardPainter extends CustomPainter {
            final List<int> redPawns;
            final List<int> greenPawns;
            MasterLudoBoardPainter({required this.redPawns, required this.greenPawns});

            @override
            void paint(Canvas canvas, Size size) {
              final step = size.width / 15;
              final paint = Paint()..style = PaintingStyle.fill;

              // ১. ৪ কোণায় বেস বক্স (Home Bases)
              paint.color = const Color(0xFFE53935); // Red Base
              canvas.drawRect(Rect.fromLTWH(0, 0, step * 6, step * 6), paint);

              paint.color = const Color(0xFF43A047); // Green Base
              canvas.drawRect(Rect.fromLTWH(step * 9, 0, step * 6, step * 6), paint);

              paint.color = const Color(0xFF1E88E5); // Blue Base
              canvas.drawRect(Rect.fromLTWH(0, step * 9, step * 6, step * 6), paint);

              paint.color = const Color(0xFFFDD835); // Yellow Base
              canvas.drawRect(Rect.fromLTWH(step * 9, step * 9, step * 6, step * 6), paint);

              // ২. হোম বেসের ভেতরের সাদা রাউন্ডেড বক্স ও ৪টি ঘুঁটির পকেট
              void drawHomePocket(double startX, double startY, Color color, List<int> pawns, bool isRed) {
                final whitePaint = Paint()..color = Colors.white;
                final rrect = RRect.fromRectAndRadius(Rect.fromLTWH(startX + step, startY + step, step * 4, step * 4), const Radius.circular(16));
                canvas.drawRRect(rrect, whitePaint);

                // ৪টি ঘুঁটির ঘর
                final pocketCoords = [
                  Offset(startX + step * 2, startY + step * 2),
                  Offset(startX + step * 4, startY + step * 2),
                  Offset(startX + step * 2, startY + step * 4),
                  Offset(startX + step * 4, startY + step * 4),
                ];

                final slotPaint = Paint()..color = color.withOpacity(0.2)..style = PaintingStyle.fill;
                final borderPaint = Paint()..color = color..style = PaintingStyle.stroke..strokeWidth = 2;

                for (int i = 0; i < 4; i++) {
                  canvas.drawCircle(pocketCoords[i], step * 0.7, slotPaint);
                  canvas.drawCircle(pocketCoords[i], step * 0.7, borderPaint);

                  // ঘুঁটি যদি ঘরে থাকে
                  if (pawns[i] == -1) {
                    _drawRealisticPawn(canvas, pocketCoords[i], step * 0.55, color);
                  }
                }
              }

              drawHomePocket(0, 0, const Color(0xFFE53935), redPawns, true);
              drawHomePocket(step * 9, 0, const Color(0xFF43A047), greenPawns, false);
              drawHomePocket(0, step * 9, const Color(0xFF1E88E5), [-1, -1, -1, -1], false);
              drawHomePocket(step * 9, step * 9, const Color(0xFFFDD835), [-1, -1, -1, -1], false);

              // ৩. হোম পাথ বা রঙিন রাস্তা
              final pathRed = Paint()..color = const Color(0xFFE53935);
              for (int c = 1; c <= 5; c++) {
                canvas.drawRect(Rect.fromLTWH(c * step, 7 * step, step, step), pathRed);
              }

              final pathGreen = Paint()..color = const Color(0xFF43A047);
              for (int r = 1; r <= 5; r++) {
                canvas.drawRect(Rect.fromLTWH(7 * step, r * step, step, step), pathGreen);
              }

              final pathYellow = Paint()..color = const Color(0xFFFDD835);
              for (int c = 9; c <= 13; c++) {
                canvas.drawRect(Rect.fromLTWH(c * step, 7 * step, step, step), pathYellow);
              }

              final pathBlue = Paint()..color = const Color(0xFF1E88E5);
              for (int r = 9; r <= 13; r++) {
                canvas.drawRect(Rect.fromLTWH(7 * step, r * step, step, step), pathBlue);
              }

              // ৪. সেফ জোন স্টার (⭐)
              canvas.drawRect(Rect.fromLTWH(1 * step, 6 * step, step, step), pathRed); // Red entry
              canvas.drawRect(Rect.fromLTWH(8 * step, 1 * step, step, step), pathGreen); // Green entry

              // গ্রিড বর্ডার লাইন ড্রয়িং
              final gridBorder = Paint()..style = PaintingStyle.stroke..color = Colors.black26..strokeWidth = 1;
              for (int r = 0; r < 15; r++) {
                for (int c = 0; c < 15; c++) {
                  canvas.drawRect(Rect.fromLTWH(c * step, r * step, step, step), gridBorder);
                }
              }

              // ৫. সেন্ট্রাল হোম ট্রায়াঙ্গেল
              final center = Offset(step * 7.5, step * 7.5);
              final pRed = Path()..moveTo(step * 6, step * 6)..lineTo(step * 6, step * 9)..lineTo(center.dx, center.dy)..close();
              canvas.drawPath(pRed, Paint()..color = const Color(0xFFE53935));

              final pGreen = Path()..moveTo(step * 6, step * 6)..lineTo(step * 9, step * 6)..lineTo(center.dx, center.dy)..close();
              canvas.drawPath(pGreen, Paint()..color = const Color(0xFF43A047));

              final pYellow = Path()..moveTo(step * 9, step * 6)..lineTo(step * 9, step * 9)..lineTo(center.dx, center.dy)..close();
              canvas.drawPath(pYellow, Paint()..color = const Color(0xFFFDD835));

              final pBlue = Path()..moveTo(step * 6, step * 9)..lineTo(step * 9, step * 9)..lineTo(center.dx, center.dy)..close();
              canvas.drawPath(pBlue, Paint()..color = const Color(0xFF1E88E5));

              // ৬. চলমান ঘুঁটিগুলো ড্র করা
              for (int i = 0; i < 4; i++) {
                if (redPawns[i] >= 0) {
                  double posX = (1.5 + (redPawns[i] % 12)) * step;
                  _drawRealisticPawn(canvas, Offset(posX, step * 7.5), step * 0.5, const Color(0xFFD32F2F));
                }
                if (greenPawns[i] >= 0) {
                  double posX = (13.5 - (greenPawns[i] % 12)) * step;
                  _drawRealisticPawn(canvas, Offset(posX, step * 7.5), step * 0.5, const Color(0xFF388E3C));
                }
              }
            }

            // ৩ডি লুডু ঘুঁটি পেইন্টার
            void _drawRealisticPawn(Canvas canvas, Offset pos, double radius, Color color) {
              // শ্যাডো
              canvas.drawCircle(pos.translate(0, 3), radius, Paint()..color = Colors.black38);
              // মূল বডি
              canvas.drawCircle(pos, radius, Paint()..color = color);
              // গোল্ডেন রিং
              canvas.drawCircle(pos, radius * 0.65, Paint()..color = Colors.amber..style = PaintingStyle.stroke..strokeWidth = 2);
              // মাথার ক্যাপ
              canvas.drawCircle(pos, radius * 0.45, Paint()..color = Colors.white);
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }

          // ৮. আসল ডাইস ফোঁটা পেইন্টার (১ থেকে ৬ ফোঁটা)
          class DiceDotsPainter extends CustomPainter {
            final int dots;
            DiceDotsPainter({required this.dots});

            @override
            void paint(Canvas canvas, Size size) {
              final dotPaint = Paint()..color = Colors.black87..style = PaintingStyle.fill;
              final r = size.width * 0.1;
              final w = size.width;
              final h = size.height;

              void d(double x, double y) => canvas.drawCircle(Offset(x, y), r, dotPaint);

              if (dots == 1) {
                d(w * 0.5, h * 0.5);
              } else if (dots == 2) {
                d(w * 0.25, h * 0.25);
                d(w * 0.75, h * 0.75);
              } else if (dots == 3) {
                d(w * 0.25, h * 0.25);
                d(w * 0.5, h * 0.5);
                d(w * 0.75, h * 0.75);
              } else if (dots == 4) {
                d(w * 0.25, h * 0.25);
                d(w * 0.75, h * 0.25);
                d(w * 0.25, h * 0.75);
                d(w * 0.75, h * 0.75);
              } else if (dots == 5) {
                d(w * 0.25, h * 0.25);
                d(w * 0.75, h * 0.25);
                d(w * 0.5, h * 0.5);
                d(w * 0.25, h * 0.75);
                d(w * 0.75, h * 0.75);
              } else if (dots == 6) {
                d(w * 0.25, h * 0.2);
                d(w * 0.75, h * 0.2);
                d(w * 0.25, h * 0.5);
                d(w * 0.75, h * 0.5);
                d(w * 0.25, h * 0.8);
                d(w * 0.75, h * 0.8);
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

      - name: Build Real Ludo Star Release APK
        run: flutter build apk --release

      - name: Upload Real Ludo Star APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumman-ludo-real-star-edition
          path: build/app/outputs/flutter-apk/app-release.apk
