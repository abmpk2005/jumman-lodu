                            subtitle: Text("ফোন: ${p['phone_number']} | আইডি: ${p['player_id']}\nম্যাচ: ${p['total_matches'] ?? 0} | জয়: ${p['matches_won'] ?? 0}"),
                            trailing: ElevatedButton(onPressed: () => _editPlayer(p), child: const Text("কন্ট্রোল")),
