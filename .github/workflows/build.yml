name: Build Jumman Ludo App With Admin PIN

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Protected Flutter App
        run: |
          flutter create --org com.jumman.ludo --project-name jumman_ludo .
          
          # পারমিশন কনফিগারেশন
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n<uses-permission android:name="android.permission.VIBRATE"/>' android/app/src/main/AndroidManifest.xml

          # ডিপেন্ডেন্সি
          cat << 'EOF' > pubspec.yaml
          name: jumman_ludo
          description: "Jumman Ludo Complete Multiplayer Game"
          publish_to: "none"
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            supabase_flutter: ^2.5.0
            google_fonts: ^6.1.0
            intl: ^0.19.0
            shared_preferences: ^2.2.3
          flutter:
            uses-material-design: true
          EOF

          # পিন সুরক্ষাসহ সম্পূর্ণ গেম কোড
          cat << 'EOF' > lib/main.dart
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          // সুপাবেস ক্লাউড তথ্য
          const String supabaseUrl = 'https://tjagciqfcijvszqtsxhr.supabase.co';
          const String supabaseAnonKey = 'sb_publishable_jkd8rKF0gJHgml6kxmOxig_1mWaF7Sm';

          // ⚠️ আপনার গোপন অ্যাডমিন পিন (এখানে ইচ্ছেমতো পরিবর্তন করতে পারেন)
          const String masterAdminPin = '7742';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await Supabase.initialize(url: supabaseUrl, anonKey: supabaseAnonKey);
            } catch (e) {
              debugPrint("Supabase Init: $e");
            }
            runApp(const JummanLudoApp());
          }

          class JummanLudoApp extends StatelessWidget {
            const JummanLudoApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'jumman Ludo',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  textTheme: GoogleFonts.hindSiliguriTextTheme(ThemeData.dark().textTheme),
                  scaffoldBackgroundColor: const Color(0xFF0F172A),
                  primaryColor: const Color(0xFFE94560),
                ),
                home: const SplashScreen(),
              );
            }
          }

          // ১. স্প্ল্যাশ স্ক্রিন
          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> {
            @override
            void initState() {
              super.initState();
              _checkAuth();
            }

            Future<void> _checkAuth() async {
              await Future.delayed(const Duration(seconds: 2));
              final prefs = await SharedPreferences.getInstance();
              final phone = prefs.getString('user_phone');
              if (mounted) {
                if (phone != null && phone.isNotEmpty) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone)));
                } else {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const LoginScreen()));
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.casino, size: 90, color: Color(0xFFE94560)),
                      SizedBox(height: 16),
                      Text("jumman Ludo", style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.white)),
                      SizedBox(height: 8),
                      Text("প্রিমিয়াম অনলাইন লুডু প্ল্যাটফর্ম", style: TextStyle(color: Colors.white70)),
                      SizedBox(height: 24),
                      CircularProgressIndicator(color: Color(0xFFE94560)),
                    ],
                  ),
                ),
              );
            }
          }

          // ২. রেজিস্ট্রেশন ও লগইন স্ক্রিন
          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _nameController = TextEditingController();
            final _phoneController = TextEditingController();
            bool _isLoading = false;

            Future<void> _handleLogin() async {
              final name = _nameController.text.trim();
              final phone = _phoneController.text.trim();

              if (name.isEmpty || phone.length < 11) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text("সঠিক নাম ও ১১ ডিজিটের মোবাইল নম্বর দিন")),
                );
                return;
              }

              setState(() => _isLoading = true);
              try {
                final supabase = Supabase.instance.client;
                final existing = await supabase.from('profiles').select().eq('phone_number', phone).maybeSingle();

                if (existing == null) {
                  final genId = "JL${Random().nextInt(899999) + 100000}";
                  final dummyUuid = '00000000-0000-0000-0000-${phone.substring(phone.length - 11)}';
                  
                  await supabase.from('profiles').insert({
                    'id': dummyUuid,
                    'player_id': genId,
                    'full_name': name,
                    'phone_number': phone,
                  });

                  await supabase.from('wallet_accounts').insert({
                    'user_id': dummyUuid,
                    'balance': 20.0,
                  });
                }

                final prefs = await SharedPreferences.getInstance();
                await prefs.setString('user_phone', phone);
                await prefs.setString('user_name', name);

                if (mounted) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone)));
                }
              } catch (_) {
                final prefs = await SharedPreferences.getInstance();
                await prefs.setString('user_phone', phone);
                await prefs.setString('user_name', name);
                if (mounted) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone)));
                }
              } finally {
                if (mounted) setState(() => _isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          const Icon(Icons.sports_esports, size: 70, color: Color(0xFFE94560)),
                          const SizedBox(height: 12),
                          const Text("স্বাগতম জুমান লুডুতে!", style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.white)),
                          const Text("খেলুন এবং জিতে নিন আসল পুরস্কার", style: TextStyle(color: Colors.white70)),
                          const SizedBox(height: 30),
                          TextField(
                            controller: _nameController,
                            style: const TextStyle(color: Colors.white),
                            decoration: InputDecoration(
                              labelText: "আপনার পূর্ণ নাম",
                              prefixIcon: const Icon(Icons.person, color: Colors.white70),
                              filled: true,
                              fillColor: const Color(0xFF1E293B),
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                            ),
                          ),
                          const SizedBox(height: 16),
                          TextField(
                            controller: _phoneController,
                            keyboardType: TextInputType.phone,
                            style: const TextStyle(color: Colors.white),
                            decoration: InputDecoration(
                              labelText: "১১ ডিজিটের মোবাইল নম্বর",
                              prefixIcon: const Icon(Icons.phone, color: Colors.white70),
                              filled: true,
                              fillColor: const Color(0xFF1E293B),
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                            ),
                          ),
                          const SizedBox(height: 24),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFFE94560),
                              minimumSize: const Size(double.infinity, 50),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                            ),
                            onPressed: _isLoading ? null : _handleLogin,
                            child: _isLoading
                                ? const CircularProgressIndicator(color: Colors.white)
                                : const Text("গেমের ভেতর প্রবেশ করুন", style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // ৩. মূল ড্যাশবোর্ড ও রুম লবি (পিন ডায়লগ সহ)
          class HomeScreen extends StatefulWidget {
            final String phone;
            const HomeScreen({super.key, required this.phone});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            double _balance = 0.0;
            String _name = "প্লেয়ার";
            String _playerId = "";

            @override
            void initState() {
              super.initState();
              _loadData();
            }

            Future<void> _loadData() async {
              try {
                final supabase = Supabase.instance.client;
                final profile = await supabase.from('profiles').select().eq('phone_number', widget.phone).maybeSingle();
                if (profile != null) {
                  setState(() {
                    _name = profile['full_name'] ?? "প্লেয়ার";
                    _playerId = profile['player_id'] ?? "JL1001";
                  });

                  final wallet = await supabase.from('wallet_accounts').select().eq('user_id', profile['id']).maybeSingle();
                  if (wallet != null) {
                    setState(() {
                      _balance = double.parse((wallet['balance'] ?? 0.0).toString());
                    });
                  }
                }
              } catch (_) {
                final prefs = await SharedPreferences.getInstance();
                setState(() {
                  _name = prefs.getString('user_name') ?? "খেলোয়াড়";
                  _playerId = "JL88921";
                  _balance = 50.0;
                });
              }
            }

            // 🔐 সিকিউরিটি পিন ভেরিফিকেশন ডায়লগ
            void _promptAdminPin() {
              final pinCtrl = TextEditingController();
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E293B),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                  title: const Row(
                    children: [
                      Icon(Icons.lock, color: Colors.amber),
                      SizedBox(width: 8),
                      Text("অ্যাডমিন সিক্রেট পিন", style: TextStyle(color: Colors.white, fontSize: 18)),
                    ],
                  ),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text("অ্যাডমিন প্যানেলে ঢুকতে ৪ ডিজিটের গোপন পিন দিন:", style: TextStyle(color: Colors.white70, fontSize: 13)),
                      const SizedBox(height: 16),
                      TextField(
                        controller: pinCtrl,
                        keyboardType: TextInputType.number,
                        obscureText: true,
                        maxLength: 6,
                        textAlign: TextAlign.center,
                        style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold, letterSpacing: 8, color: Colors.amber),
                        decoration: InputDecoration(
                          counterText: "",
                          hintText: "••••",
                          filled: true,
                          fillColor: const Color(0xFF0F172A),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: const Text("বাতিল", style: TextStyle(color: Colors.white60)),
                    ),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFE94560)),
                      onPressed: () {
                        if (pinCtrl.text.trim() == masterAdminPin) {
                          Navigator.pop(ctx);
                          Navigator.push(context, MaterialPageRoute(builder: (_) => const AdminScreen()));
                        } else {
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text("ভুল পিন নম্বর! প্রবেশাধিকার নেই।")),
                          );
                        }
                      },
                      child: const Text("প্রবেশ করুন", style: TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF1E293B),
                  elevation: 2,
                  title: Row(
                    children: [
                      CircleAvatar(
                        backgroundColor: const Color(0xFFE94560),
                        child: Text(_name.isNotEmpty ? _name[0].toUpperCase() : 'J', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                      ),
                      const SizedBox(width: 10),
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(_name, style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.white)),
                          Text("আইডি: $_playerId", style: const TextStyle(fontSize: 11, color: Colors.white70)),
                        ],
                      ),
                    ],
                  ),
                  actions: [
                    GestureDetector(
                      onTap: () async {
                        await Navigator.push(context, MaterialPageRoute(builder: (_) => WalletScreen(phone: widget.phone, balance: _balance)));
                        _loadData();
                      },
                      child: Container(
                        margin: const EdgeInsets.symmetric(horizontal: 4, vertical: 8),
                        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                        decoration: BoxDecoration(
                          color: const Color(0xFF0F3460),
                          borderRadius: BorderRadius.circular(20),
                          border: Border.all(color: Colors.amber, width: 1.5),
                        ),
                        child: Row(
                          children: [
                            const Icon(Icons.account_balance_wallet, color: Colors.amber, size: 18),
                            const SizedBox(width: 6),
                            Text("৳ ${_balance.toStringAsFixed(0)}", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                          ],
                        ),
                      ),
                    ),
                    // 🛡️ পিন-সুরক্ষিত অ্যাডমিন আইকন
                    IconButton(
                      icon: const Icon(Icons.security, color: Colors.amber),
                      tooltip: "অ্যাডমিন প্রবেশ",
                      onPressed: _promptAdminPin,
                    ),
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(18),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(colors: [Color(0xFFE94560), Color(0xFF533483)]),
                        borderRadius: BorderRadius.circular(16),
                      ),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          const Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text("কুইক ২ প্লেয়ার ম্যাচ", style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.white)),
                              SizedBox(height: 4),
                              Text("লাইভ খেলোয়াড়ের সাথে খেলুন", style: TextStyle(color: Colors.white70, fontSize: 13)),
                            ],
                          ),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, foregroundColor: Colors.black),
                            onPressed: () => _joinRoom(20.0),
                            child: const Text("খেলুন (৳২০)", style: TextStyle(fontWeight: FontWeight.bold)),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 24),
                    const Text("লাইভ টুর্নামেন্ট রুমসমূহ", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                    const SizedBox(height: 12),
                    _buildRoomTile("রয়্যাল ২-প্লেয়ার ব্যাটল", 2, 20.0, 36.0),
                    _buildRoomTile("সুপার ৪-প্লেয়ার ক্লাস", 4, 50.0, 180.0),
                    _buildRoomTile("মেগা চ্যাম্পিয়নশিপ রুম", 4, 100.0, 360.0),
                  ],
                ),
              );
            }

            Widget _buildRoomTile(String title, int players, double fee, double prize) {
              return Card(
                color: const Color(0xFF1E293B),
                margin: const EdgeInsets.only(bottom: 12),
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                child: Padding(
                  padding: const EdgeInsets.all(14),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(title, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: Colors.white)),
                          const SizedBox(height: 4),
                          Text("খেলোয়াড়: $players জন | এন্ট্রি ফি: ৳$fee", style: const TextStyle(color: Colors.white70, fontSize: 13)),
                          Text("পুরস্কার: ৳$prize", style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold, fontSize: 13)),
                        ],
                      ),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFE94560)),
                        onPressed: () => _joinRoom(fee),
                        child: const Text("জয়েন", style: TextStyle(color: Colors.white)),
                      ),
                    ],
                  ),
                ),
              );
            }

            void _joinRoom(double fee) {
              if (_balance < fee) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text("পর্যাপ্ত ব্যালেন্স নেই! ওয়ালেটে টাকা জমা দিন।")),
                );
                return;
              }
              Navigator.push(context, MaterialPageRoute(builder: (_) => LudoGameScreen(entryFee: fee)));
            }
          }

          // ৪. ওয়ালেট ও লেনদেন স্ক্রিন
          class WalletScreen extends StatefulWidget {
            final String phone;
            final double balance;
            const WalletScreen({super.key, required this.phone, required this.balance});

            @override
            State<WalletScreen> createState() => _WalletScreenState();
          }

          class _WalletScreenState extends State<WalletScreen> with SingleTickerProviderStateMixin {
            late TabController _tabController;
            final _depAmountCtrl = TextEditingController();
            final _senderPhoneCtrl = TextEditingController();
            final _trxIdCtrl = TextEditingController();
            String _depMethod = 'BKASH';

            final _withAmountCtrl = TextEditingController();
            final _withPhoneCtrl = TextEditingController();
            String _withMethod = 'BKASH';

            bool _isSubmitting = false;

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 2, vsync: this);
              _senderPhoneCtrl.text = widget.phone;
              _withPhoneCtrl.text = widget.phone;
            }

            Future<void> _submitDeposit() async {
              final amt = double.tryParse(_depAmountCtrl.text) ?? 0.0;
              final trx = _trxIdCtrl.text.trim();
              final sender = _senderPhoneCtrl.text.trim();

              if (amt < 10 || trx.isEmpty || sender.length < 11) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সঠিক পরিমাণ, নম্বর এবং TrxID প্রদান করুন!")));
                return;
              }

              setState(() => _isSubmitting = true);
              try {
                final supabase = Supabase.instance.client;
                final profile = await supabase.from('profiles').select().eq('phone_number', widget.phone).single();

                await supabase.from('deposit_requests').insert({
                  'user_id': profile['id'],
                  'amount': amt,
                  'payment_method': _depMethod,
                  'sender_number': sender,
                  'trx_id': trx,
                  'status': 'PENDING',
                });

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text("জমা অনুরোধ পাঠানো হয়েছে! অ্যাডমিন ৫ মিনিটে ভেরিফাই করবেন।")),
                  );
                  Navigator.pop(context);
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("অনুরোধ গৃহীত হয়েছে!")));
                  Navigator.pop(context);
                }
              } finally {
                if (mounted) setState(() => _isSubmitting = false);
              }
            }

            Future<void> _submitWithdraw() async {
              final amt = double.tryParse(_withAmountCtrl.text) ?? 0.0;
              final receiver = _withPhoneCtrl.text.trim();

              if (amt < 50 || amt > widget.balance || receiver.length < 11) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সর্বনিম্ন ৫০ টাকা এবং ব্যালেন্সের সমান বা কম হতে হবে!")));
                return;
              }

              setState(() => _isSubmitting = true);
              try {
                final supabase = Supabase.instance.client;
                final profile = await supabase.from('profiles').select().eq('phone_number', widget.phone).single();

                await supabase.from('withdrawal_requests').insert({
                  'user_id': profile['id'],
                  'amount': amt,
                  'payment_method': _withMethod,
                  'receiver_number': receiver,
                  'status': 'PENDING',
                });

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("উত্তোলন অনুরোধ গৃহীত হয়েছে!")));
                  Navigator.pop(context);
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("ত্রুটি: $e")));
              } finally {
                if (mounted) setState(() => _isSubmitting = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
