          class AdminScreen extends StatefulWidget {
            const AdminScreen({super.key});
            @override
            State<AdminScreen> createState() => _AdminScreenState();
          }

          class _AdminScreenState extends State<AdminScreen> with SingleTickerProviderStateMixin {
            late TabController _tab;
            @override
            void initState() { super.initState(); _tab = TabController(length: 3, vsync: this); }

            void _editPlayer(Map<String, dynamic> p) {
              final balCtrl = TextEditingController();
              bool banned = p['is_banned'] ?? false;
              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (context, setD) {
                    return AlertDialog(
                      backgroundColor: const Color(0xFF35042D),
                      title: Text("${p['full_name']} (কন্ট্রোল)", style: const TextStyle(color: Colors.amber)),
                      content: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Text("ফোন: ${p['phone_number']}"),
                          Text("মোট ম্যাচ: ${p['total_matches'] ?? 0} | জয়: ${p['matches_won'] ?? 0}"),
                          const SizedBox(height: 10),
                          TextField(controller: balCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "ব্যালেন্স যোগ/বিয়োগ")),
                          const SizedBox(height: 14),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: banned ? Colors.green : Colors.red),
                            onPressed: () async {
                              bool next = !banned;
                              await Supabase.instance.client.from('profiles').update({'is_banned': next}).eq('id', p['id']);
                              setD(() => banned = next);
                            },
                            child: Text(banned ? "আনব্লক করুন" : "ব্লক করুন", style: const TextStyle(color: Colors.white)),
                          )
                        ],
                      ),
                      actions: [
                        ElevatedButton(
                          onPressed: () async {
                            double change = double.tryParse(balCtrl.text) ?? 0;
                            if (change != 0) {
                              final w = await Supabase.instance.client.from('wallet_accounts').select().eq('user_id', p['id']).maybeSingle();
                              if (w != null) {
                                double cur = double.parse((w['balance'] ?? 0.0).toString());
                                await Supabase.instance.client.from('wallet_accounts').update({'balance': cur + change}).eq('user_id', p['id']);
                              }
                            }
                            Navigator.pop(ctx);
                          },
                          child: const Text("সংরক্ষণ"),
                        )
