name: Build Jumman Ludo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Android Platform Skeleton
        run: |
          flutter create --org com.jumman.ludo --project-name jumman_ludo .
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n<uses-permission android:name="android.permission.VIBRATE"/>\n<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent><package android:name="com.whatsapp"/><package android:name="org.telegram.messenger"/></queries>' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jumman-ludo-app
          path: build/app/outputs/flutter-apk/app-release.apk
