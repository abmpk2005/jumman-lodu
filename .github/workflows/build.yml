          // ৬. আসল লুডু গেম বোর্ড ও ম্যাচ ইঞ্জিন (এন্ট্রি ফি কর্তন ও জয়ী লজিক)
          class LudoGameScreen extends StatefulWidget {
            final double entryFee;
            final String phone;
            const LudoGameScreen({super.key, required this.entryFee, required this.phone});
            @override
            State<LudoGameScreen> createState() => _LudoGameScreenState();
          }

          class _LudoGameScreenState extends State<LudoGameScreen> {
            int _dice = 1;
            bool _rolling = false;
            int _turn = 0;
            List<int> red = [-1, -1, -1, -1];
            List<int> green = [-1, -1, -1, -1];

            @override
            void initState() {
              super.initState();
              _deductEntryFee();
            }

            // ম্যাচ শুরুর সাথে সাথে ওয়ালেট থেকে ফি কাটা
            Future<void> _deductEntryFee() async {
              try {
                final supabase = Supabase.instance.client;
                final dummyUuid = '00000000-0000-0000-0000-${widget.phone.substring(widget.phone.length - 11)}';
                final wallet = await supabase.from('wallet_accounts').select().eq('user_id', dummyUuid).single();
                double currentBal = double.parse((wallet['balance'] ?? 0.0).toString());
                
                await supabase.from('wallet_accounts').update({'balance': currentBal - widget.entryFee}).eq('user_id', dummyUuid);
              } catch (_) {}
            }

            void _roll() {
              if (_rolling) return;
              setState(() => _rolling = true);
              Future.delayed(const Duration(milliseconds: 400), () {
                setState(() {
                  _dice = Random().nextInt(6) + 1;
                  _rolling = false;
                  if (_turn == 0) {
                    _move(red);
                    if (_dice != 6) {
                      _turn = 1;
                      Future.delayed(const Duration(milliseconds: 1000), () => _roll());
                    }
                  } else {
                    _move(green);
                    if (_dice != 6) {
                      _turn = 0;
                    } else {
                      Future.delayed(const Duration(milliseconds: 1000), () => _roll());
                    }
                  }
                });
              });
            }

            void _move(List<int> tokens) {
              for (int i = 0; i < 4; i++) {
                if (tokens[i] == -1 && _dice == 6) {
                  tokens[i] = 0;
                  break;
                } else if (tokens[i] >= 0 && tokens[i] < 57) {
                  tokens[i] = min(57, tokens[i] + _dice);
                  break;
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text("ম্যাচ - ফি: ৳${widget.entryFee.toInt()}"), backgroundColor: const Color(0xFF4A0A3A)),
                body: Column(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Row(
                        children: [
                          const CircleAvatar(backgroundColor: Colors.green, radius: 14),
                          const SizedBox(width: 8),
                          Text("প্রতিপক্ষ (সবুজ) ${_turn == 1 ? '— ভাবছেন...' : ''}", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                        ],
                      ),
                    ),
                    AspectRatio(
                      aspectRatio: 1.0,
                      child: Container(
                        margin: const EdgeInsets.all(8),
                        decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(14), border: Border.all(color: Colors.amber, width: 3)),
                        child: CustomPaint(painter: LudoBoardPainter(redTokens: red, greenTokens: green)),
                      ),
                    ),
                    Container(
                      padding: const EdgeInsets.all(16),
                      color: const Color(0xFF35042D),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Row(
                            children: [
                              const CircleAvatar(backgroundColor: Colors.red, radius: 14),
                              const SizedBox(width: 8),
                              Text("আপনার চাল (লাল) ${_turn == 0 ? '— চালুন!' : ''}", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                            ],
                          ),
                          GestureDetector(
                            onTap: (_turn == 0 && !_rolling) ? _roll : null,
                            child: Container(
                              width: 60,
                              height: 60,
                              decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.red, width: 3)),
                              child: Center(
                                child: _rolling
