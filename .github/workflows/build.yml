          class _AdminScreenState extends State<AdminScreen> with SingleTickerProviderStateMixin {
            late TabController _adminTabCtrl;

            @override
            void initState() {
              super.initState();
              _adminTabCtrl = TabController(length: 3, vsync: this);
            }

            @override
            Widget build(BuildContext context) {
              final supabase = Supabase.instance.client;
              return Scaffold(
                appBar: AppBar(
                  title: const Text("অ্যাডমিন কন্ট্রোল"),
                  backgroundColor: const Color(0xFF4A0A3A),
                  bottom: TabBar(
                    controller: _adminTabCtrl,
                    indicatorColor: Colors.amber,
                    tabs: const [Tab(text: "জমা"), Tab(text: "উত্তোলন"), Tab(text: "খেলোয়াড়")],
                  ),
                ),
                body: TabBarView(
                  controller: _adminTabCtrl,
                  children: [
                    StreamBuilder<List<Map<String, dynamic>>>(
                      stream: supabase.from('deposit_requests').stream(primaryKey: ['id']).eq('status', 'PENDING'),
                      builder: (context, snapshot) {
                        if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                        final list = snapshot.data!;
                        if (list.isEmpty) return const Center(child: Text("কোনো পেন্ডিং জমা অনুরোধ নেই!"));

                        return ListView.builder(
                          itemCount: list.length,
                          itemBuilder: (context, i) {
                            final req = list[i];
                            return Card(
                              color: const Color(0xFF35042D),
                              margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12), side: const BorderSide(color: Colors.amber)),
                              child: ListTile(
                                title: Text("৳${req['amount']} (${req['payment_method']})", style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                                subtitle: Text("প্রেরক: ${req['sender_number']}\nTrxID: ${req['trx_id']}"),
                                trailing: Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.check_circle, color: Colors.greenAccent, size: 30),
                                      onPressed: () async {
                                        await supabase.rpc('approve_deposit_transaction', params: {
                                          'p_req_id': req['id'],
                                          'p_user_id': req['user_id'].toString(),
                                          'p_amount': req['amount'],
                                        });
                                      },
                                    ),
                                    IconButton(
                                      icon: const Icon(Icons.cancel, color: Colors.redAccent, size: 30),
                                      onPressed: () async {
                                        await supabase.from('deposit_requests').update({'status': 'REJECTED'}).eq('id', req['id']);
                                      },
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        );
                      },
                    ),
                    StreamBuilder<List<Map<String, dynamic>>>(
                      stream: supabase.from('withdrawal_requests').stream(primaryKey: ['id']).eq('status', 'PENDING'),
                      builder: (context, snapshot) {
                        if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                        final list = snapshot.data!;
                        if (list.isEmpty) return const Center(child: Text("কোনো পেন্ডিং উত্তোলন অনুরোধ নেই!"));

                        return ListView.builder(
                          itemCount: list.length,
                          itemBuilder: (context, i) {
                            final req = list[i];
                            return Card(
                              color: const Color(0xFF35042D),
                              margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12), side: const BorderSide(color: Colors.blueAccent)),
                              child: ListTile(
                                title: Text("টাকা: ৳${req['amount']}", style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold, fontSize: 16)),
                                subtitle: Text("নম্বর: ${req['receiver_number']}"),
                                trailing: Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.check_circle, color: Colors.greenAccent, size: 30),
                                      onPressed: () async {
                                        await supabase.rpc('approve_withdrawal_transaction', params: {
                                          'p_req_id': req['id'],
                                          'p_user_id': req['user_id'].toString(),
                                          'p_amount': req['amount'],
                                        });
                                      },
                                    ),
                                    IconButton(
                                      icon: const Icon(Icons.cancel, color: Colors.redAccent, size: 30),
                                      onPressed: () async {
                                        await supabase.from('withdrawal_requests').update({'status': 'REJECTED'}).eq('id', req['id']);
                                      },
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        );
                      },
                    ),
                    StreamBuilder<List<Map<String, dynamic>>>(
                      stream: supabase.from('profiles').stream(primaryKey: ['id']),
                      builder: (context, snapshot) {
                        if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                        final players = snapshot.data!;
                        return ListView.builder(
                          itemCount: players.length,
                          itemBuilder: (context, i) {
                            final p = players[i];
                            return Card(
                              color: const Color(0xFF35042D),
                              margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                              child: ListTile(
                                leading: CircleAvatar(backgroundColor: Colors.amber, child: Text(p['full_name'] != null && p['full_name'].toString().isNotEmpty ? p['full_name'][0] : 'P', style: const TextStyle(color: Colors.black))),
                                title: Text("${p['full_name']} (${p['player_id']})", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                                subtitle: Text("ফোন: ${p['phone_number']} | ম্যাচ: ${p['total_matches'] ?? 0} | জয়: ${p['matches_won'] ?? 0}", style: const TextStyle(color: Colors.white70)),
                              ),
                            );
                          },
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }

          class RealLudoEngineScreen extends StatefulWidget {
            final double entryFee;
            final String userId;
            final String phone;
            final String playerName;
            const RealLudoEngineScreen({super.key, required this.entryFee, required this.userId, required this.phone, required this.playerName});

            @override
            State<RealLudoEngineScreen> createState() => _RealLudoEngineScreenState();
          }

          class _RealLudoEngineScreenState extends State<RealLudoEngineScreen> with TickerProviderStateMixin {
            int _playerDice = 1;
            int _opponentDice = 1;
            int _displayPlayerDice = 1;
            int _displayOpponentDice = 1;

            bool _isPlayerRolling = false;
            bool _isOpponentRolling = false;
            bool _waitingForPawnTap = false;
            int _turn = 0; // 0 = Player (Yellow), 1 = Opponent (Red)
            List<int> _movablePawns = [];

            List<int> yellowPawns = [-1, -1, -1, -1];
            List<int> redPawns = [-1, -1, -1, -1];

            final Set<int> safeGlobalTiles = {0, 8, 13, 21, 26, 34, 39, 47};

            late AnimationController _glowCtrl;
            late AnimationController _playerDiceRotCtrl;
            late AnimationController _opponentDiceRotCtrl;

            String _turnStatus = "👉 আপনার চাল! ছক্কায় ট্যাপ করুন";

            static const List<Point<int>> trackPoints = [
              Point(8, 0), Point(8, 1), Point(8, 2), Point(8, 3), Point(8, 4), Point(8, 5),
              Point(9, 6), Point(10, 6), Point(11, 6), Point(12, 6), Point(13, 6), Point(14, 6),
              Point(14, 7),
              Point(14, 8), Point(13, 8), Point(12, 8), Point(11, 8), Point(10, 8), Point(9, 8),
              Point(8, 9), Point(8, 10), Point(8, 11), Point(8, 12), Point(8, 13), Point(8, 14),
              Point(7, 14),
              Point(6, 14), Point(6, 13), Point(6, 12), Point(6, 11), Point(6, 10), Point(6, 9),
              Point(5, 8), Point(4, 8), Point(3, 8), Point(2, 8), Point(1, 8), Point(0, 8),
              Point(0, 7),
              Point(0, 6), Point(1, 6), Point(2, 6), Point(3, 6), Point(4, 6), Point(5, 6),
              Point(6, 5), Point(6, 4), Point(6, 3), Point(6, 2), Point(6, 1), Point(6, 0),
              Point(7, 0),
            ];

            @override
            void initState() {
              super.initState();
              _deductEntryFee();
              _glowCtrl = AnimationController(vsync: this, duration: const Duration(milliseconds: 600))..repeat(reverse: true);
              _playerDiceRotCtrl = AnimationController(vsync: this, duration: const Duration(milliseconds: 550));
              _opponentDiceRotCtrl = AnimationController(vsync: this, duration: const Duration(milliseconds: 550));
            }

            @override
            void dispose() {
              _glowCtrl.dispose();
              _playerDiceRotCtrl.dispose();
              _opponentDiceRotCtrl.dispose();
              super.dispose();
            }

            Future<void> _deductEntryFee() async {
              if (widget.entryFee <= 0) return;
              try {
                final supabase = Supabase.instance.client;
                final wallet = await supabase.from('wallet_accounts').select().eq('user_id', widget.userId).single();
                double cur = double.parse((wallet['balance'] ?? 0.0).toString());
                await supabase.from('wallet_accounts').update({'balance': cur - widget.entryFee}).eq('user_id', widget.userId);
              } catch (_) {}
            }

            Future<void> _recordWin() async {
              try {
                final supabase = Supabase.instance.client;
                final wallet = await supabase.from('wallet_accounts').select().eq('user_id', widget.userId).single();
                double cur = double.parse((wallet['balance'] ?? 0.0).toString());
                double prize = widget.entryFee * 1.8;
                await supabase.from('wallet_accounts').update({'balance': cur + prize}).eq('user_id', widget.userId);
              } catch (_) {}
            }

            void _rollPlayerDice() {
              if (_isPlayerRolling || _waitingForPawnTap || _turn != 0) return;
              HapticFeedback.mediumImpact();
              
              setState(() {
                _isPlayerRolling = true;
                _turnStatus = "🎲 ছক্কা ঘুরছে...";
              });
              _playerDiceRotCtrl.forward(from: 0.0);

              int count = 0;
              Timer.periodic(const Duration(milliseconds: 50), (timer) {
                count++;
                setState(() {
                  _displayPlayerDice = Random().nextInt(6) + 1;
                });
                if (count >= 10) {
                  timer.cancel();
                  final finalRoll = Random().nextInt(6) + 1;
                  setState(() {
                    _playerDice = finalRoll;
                    _displayPlayerDice = finalRoll;
                    _isPlayerRolling = false;
                  });
                  _evaluatePlayerMoves();
                }
              });
            }

            void _evaluatePlayerMoves() {
              List<int> valid = [];
              for (int i = 0; i < 4; i++) {
                if (yellowPawns[i] == -1 && _playerDice == 6) {
                  valid.add(i);
                } else if (yellowPawns[i] >= 0 && (yellowPawns[i] + _playerDice <= 56)) {
                  valid.add(i);
                }
              }

              if (valid.isEmpty) {
                setState(() {
                  _turnStatus = "কোনো চাল নেই! চাল মিস!";
                });
                Future.delayed(const Duration(milliseconds: 1200), () => _passTurnToOpponent());
              } else {
                setState(() {
                  _movablePawns = valid;
                  _waitingForPawnTap = true;
                  _turnStatus = "👉 যে ঘুঁটি চালাতে চান, তাতে ট্যাপ করুন!";
                });
              }
            }

            void _onSelectPlayerPawn(int idx) {
              if (!_waitingForPawnTap || !_movablePawns.contains(idx)) return;
              HapticFeedback.lightImpact();

              setState(() {
                _waitingForPawnTap = false;
                _movablePawns.clear();

                if (yellowPawns[idx] == -1 && _playerDice == 6) {
                  yellowPawns[idx] = 0;
                  _turnStatus = "ঘুঁটি ঘর থেকে বের হলো!";
                } else {
                  yellowPawns[idx] += _playerDice;
                }
              });

              bool captured = _checkCapture(yellowPawns, idx, true);

              if (yellowPawns.every((p) => p == 56)) {
                _showVictoryDialog(true);
                return;
              }

              if (_playerDice == 6 || captured) {
                setState(() {
                  _turnStatus = captured ? "💥 ঘুঁটি কেটেছেন! বোনাস চাল!" : "🎉 ছক্কা উঠেছে! আবার চালুন!";
                });
              } else {
                _passTurnToOpponent();
              }
            }

            bool _checkCapture(List<int> pawns, int pawnIdx, bool isYellow) {
              int stepVal = pawns[pawnIdx];
              if (stepVal < 51) {
                int global = (stepVal + (isYellow ? 26 : 0)) % 52;
                if (!safeGlobalTiles.contains(global)) {
                  List<int> opp = isYellow ? redPawns : yellowPawns;
                  for (int j = 0; j < 4; j++) {
                    if (opp[j] >= 0 && opp[j] < 51) {
                      int oppGlobal = (opp[j] + (!isYellow ? 0 : 26)) % 52;
                      if (global == oppGlobal) {
                        opp[j] = -1;
                        return true;
                      }
                    }
                  }
                }
              }
              return false;
            }

            void _passTurnToOpponent() {
              setState(() {
                _turn = 1;
                _turnStatus = "প্রতিপক্ষ চাল দিচ্ছে...";
              });
              Future.delayed(const Duration(milliseconds: 1200), () => _runOpponentTurn());
            }

            void _runOpponentTurn() {
              setState(() {
                _isOpponentRolling = true;
              });
              _opponentDiceRotCtrl.forward(from: 0.0);

              int count = 0;
              Timer.periodic(const Duration(milliseconds: 50), (timer) {
                count++;
                setState(() {
                  _displayOpponentDice = Random().nextInt(6) + 1;
                });
                if (count >= 10) {
                  timer.cancel();
                  final oppRoll = Random().nextInt(6) + 1;
                  setState(() {
                    _opponentDice = oppRoll;
                    _displayOpponentDice = oppRoll;
                    _isOpponentRolling = false;
                  });

                  Future.delayed(const Duration(milliseconds: 400), () => _executeOpponentMove());
                }
              });
            }

            void _executeOpponentMove() {
              List<int> valid = [];
              for (int i = 0; i < 4; i++) {
                if (redPawns[i] == -1 && _opponentDice == 6) {
                  valid.add(i);
                } else if (redPawns[i] >= 0 && (redPawns[i] + _opponentDice <= 56)) {
                  valid.add(i);
                }
              }

              if (valid.isNotEmpty) {
                int chosen = valid.first;
                for (var idx in valid) {
                  if (redPawns[idx] >= 0) {
                    int nextG = (redPawns[idx] + _opponentDice) % 52;
                    for (int y = 0; y < 4; y++) {
                      if (yellowPawns[y] >= 0 && yellowPawns[y] < 51) {
                        int yG = (yellowPawns[y] + 26) % 52;
                        if (nextG == yG && !safeGlobalTiles.contains(nextG)) {
                          chosen = idx;
                          break;
                        }
                      }
                    }
                  }
                }

                setState(() {
                  if (redPawns[chosen] == -1 && _opponentDice == 6) {
                    redPawns[chosen] = 0;
                  } else {
                    redPawns[chosen] += _opponentDice;
                  }
                });

                bool captured = _checkCapture(redPawns, chosen, false);
                if (redPawns.every((p) => p == 56)) {
                  _showVictoryDialog(false);
                  return;
                }

                if (_opponentDice == 6 || captured) {
                  Future.delayed(const Duration(milliseconds: 1100), () => _runOpponentTurn());
                  return;
                }
              }

              setState(() {
                _turn = 0;
                _turnStatus = "👉 আপনার চাল! ছক্কায় ট্যাপ করুন";
              });
            }

