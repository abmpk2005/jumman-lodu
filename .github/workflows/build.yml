name: Build Jumman Ludo Ultimate Master Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build Ultimate Master APK
        run: |
          flutter create --org com.jumman.ludo --project-name jumman_ludo .
          
          # অ্যান্ড্রয়েড পারমিশন
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n<uses-permission android:name="android.permission.VIBRATE"/>\n<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent><package android:name="com.whatsapp"/><package android:name="org.telegram.messenger"/></queries>' android/app/src/main/AndroidManifest.xml || true

          # ডিপেন্ডেন্সি
          cat << 'EOF' > pubspec.yaml
          name: jumman_ludo
          description: "Jumman Ludo Ultimate Master Production Edition"
          publish_to: "none"
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            supabase_flutter: ^2.5.0
            intl: ^0.19.0
            shared_preferences: ^2.2.3
            url_launcher: ^6.2.5
          flutter:
            uses-material-design: true
          EOF

          # সম্পূর্ণ চূড়ান্ত মাস্টারিং কোড (main.dart)
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';

          const String supabaseUrl = 'https://tjagciqfcijvszqtsxhr.supabase.co';
          const String supabaseAnonKey = 'sb_publishable_jkd8rKF0gJHgml6kxmOxig_1mWaF7Sm';
          const String masterAdminPin = '7742';
          const String currentAppVersion = '1.0.0';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await Supabase.initialize(url: supabaseUrl, anonKey: supabaseAnonKey);
            } catch (_) {}
            runApp(const JummanLudoApp());
          }

          class JummanLudoApp extends StatelessWidget {
            const JummanLudoApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'jumman Ludo',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(brightness: Brightness.dark, scaffoldBackgroundColor: const Color(0xFF19011F)),
                home: const SplashScreen(),
              );
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> {
            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              await Future.delayed(const Duration(seconds: 2));
              final prefs = await SharedPreferences.getInstance();
              final phone = prefs.getString('user_phone');
              final userId = prefs.getString('user_id');

              if (phone != null && userId != null) {
                try {
                  final p = await Supabase.instance.client.from('profiles').select().eq('phone_number', phone).maybeSingle();
                  if (p != null && p['is_banned'] == true) {
                    if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const BannedScreen()));
                    return;
                  }
                } catch (_) {}
                if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone, userId: userId)));
              } else {
                if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const LoginScreen()));
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  width: double.infinity,
                  decoration: const BoxDecoration(gradient: LinearGradient(colors: [Color(0xFF4A0A58), Color(0xFF19011F)], begin: Alignment.topCenter, end: Alignment.bottomCenter)),
                  child: const Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.casino, size: 90, color: Color(0xFFFFD700)),
                      SizedBox(height: 16),
                      Text("JUMMAN LUDO", style: TextStyle(fontSize: 32, fontWeight: FontWeight.w900, color: Colors.white, letterSpacing: 2)),
                      Text("★ ULTIMATE MASTER PRODUCTION ★", style: TextStyle(color: Colors.amberAccent, letterSpacing: 2, fontWeight: FontWeight.bold, fontSize: 13)),
                      SizedBox(height: 35),
                      CircularProgressIndicator(color: Colors.greenAccent),
                    ],
                  ),
                ),
              );
            }
          }

          class BannedScreen extends StatelessWidget {
            const BannedScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  padding: const EdgeInsets.all(30),
                  color: const Color(0xFF24022B),
                  child: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.block_flipped, size: 90, color: Colors.redAccent),
                        const SizedBox(height: 20),
                        const Text("অ্যাকাউন্ট স্থগিত (Blocked)", style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.white)),
                        const SizedBox(height: 12),
                        const Text("নিয়ম লঙ্ঘনের কারণে আইডি সাময়িকভাবে স্থগিত করা হয়েছে।", textAlign: TextAlign.center, style: TextStyle(color: Colors.white70)),
                        const SizedBox(height: 24),
                        ElevatedButton.icon(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF25D366), minimumSize: const Size(double.infinity, 50)),
                          icon: const Icon(Icons.chat),
                          label: const Text("WhatsApp সাপোর্টে কথা বলুন"),
                          onPressed: () async {
                            final uri = Uri.parse("https://wa.me/8801774229222");
                            if (await canLaunchUrl(uri)) launchUrl(uri, mode: LaunchMode.externalApplication);
                          },
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _name = TextEditingController();
            final _phone = TextEditingController();
            bool _loading = false;

            Future<void> _login() async {
              final n = _name.text.trim();
              final p = _phone.text.trim();
              if (n.isEmpty || p.length < 11) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সঠিক নাম ও ১১ ডিজিটের মোবাইল নম্বর দিন")));
                return;
              }
              setState(() => _loading = true);
              try {
                final sb = Supabase.instance.client;
                final existing = await sb.from('profiles').select().eq('phone_number', p).maybeSingle();
                if (existing != null && existing['is_banned'] == true) {
                  if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const BannedScreen()));
                  return;
                }
                String uid = existing != null ? existing['id'].toString() : 'USR_$p';
                if (existing == null) {
                  final genId = "JL-${10000 + DateTime.now().millisecond}";
                  await sb.from('profiles').insert({'id': uid, 'player_id': genId, 'full_name': n, 'phone_number': p, 'total_matches': 0, 'matches_won': 0, 'is_banned': false});
                  await sb.from('wallet_accounts').insert({'user_id': uid, 'balance': 50.0});
                }
                final pr = await SharedPreferences.getInstance();
                await pr.setString('user_phone', p);
                await pr.setString('user_name', n);
                await pr.setString('user_id', uid);
                if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: p, userId: uid)));
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("ত্রুটি: $e")));
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      children: [
                        const Icon(Icons.casino, size: 75, color: Colors.amber),
                        const SizedBox(height: 12),
                        const Text("জুমান লুডুতে স্বাগতম!", style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.white)),
                        const SizedBox(height: 24),
                        TextField(controller: _name, decoration: InputDecoration(hintText: "পূর্ণ নাম", filled: true, fillColor: const Color(0xFF3D0947), border: OutlineInputBorder(borderRadius: BorderRadius.circular(16)))),
                        const SizedBox(height: 14),
                        TextField(controller: _phone, keyboardType: TextInputType.phone, decoration: InputDecoration(hintText: "মোবাইল নম্বর", filled: true, fillColor: const Color(0xFF3D0947), border: OutlineInputBorder(borderRadius: BorderRadius.circular(16)))),
                        const SizedBox(height: 24),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, minimumSize: const Size(double.infinity, 50), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16))),
                          onPressed: _loading ? null : _login,
                          child: _loading ? const CircularProgressIndicator(color: Colors.black) : const Text("প্রবেশ করুন", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.black)),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            final String phone;
            final String userId;
            const HomeScreen({super.key, required this.phone, required this.userId});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            double _balance = 0.0;
            String _name = "খেলোয়াড়";
            String _playerId = "JL-1000";
            int _totalMatches = 0;
            int _matchesWon = 0;
            int _level = 1;

            @override
            void initState() {
              super.initState();
              _loadData();
            }

            Future<void> _loadData() async {
              try {
                final sb = Supabase.instance.client;
                final p = await sb.from('profiles').select().eq('phone_number', widget.phone).maybeSingle();
                if (p != null) {
                  if (p['is_banned'] == true && mounted) {
                    Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const BannedScreen()));
                    return;
                  }
                  setState(() {
                    _name = p['full_name'] ?? "খেলোয়াড়";
                    _playerId = p['player_id'] ?? "JL-1000";
                    _totalMatches = p['total_matches'] ?? 0;
                    _matchesWon = p['matches_won'] ?? 0;
                    _level = max(1, (_totalMatches ~/ 5) + 1);
                  });
                }
                final w = await sb.from('wallet_accounts').select().eq('user_id', widget.userId).maybeSingle();
                if (w != null) setState(() => _balance = double.parse((w['balance'] ?? 0.0).toString()));
              } catch (_) {}
            }

            void _showProfileModal() {
              final winRate = _totalMatches > 0 ? ((_matchesWon / _totalMatches) * 100).toInt() : 0;
              showDialog(
                context: context,
                builder: (ctx) => Dialog(
                  backgroundColor: const Color(0xFF4A0A3A),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24), side: const BorderSide(color: Colors.amber, width: 2)),
                  child: Padding(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        CircleAvatar(radius: 35, backgroundColor: Colors.amber, child: Text(_name.isNotEmpty ? _name[0].toUpperCase() : 'P', style: const TextStyle(fontSize: 28, color: Colors.black, fontWeight: FontWeight.bold))),
                        const SizedBox(height: 10),
                        Text(_name, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.white)),
                        Text("ID: $_playerId | Level: $_level", style: const TextStyle(color: Colors.amberAccent)),
                        const Divider(color: Colors.white24, height: 20),
                        Text("মোট ম্যাচ: $_totalMatches | জয়: $_matchesWon ($winRate%)", style: const TextStyle(color: Colors.white70, fontSize: 13)),
                        const SizedBox(height: 14),
                        ElevatedButton(onPressed: () => Navigator.pop(ctx), child: const Text("বন্ধ করুন")),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _showSettingsDialog() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF4A0A3A),
                  title: const Text("সেটিংস", style: TextStyle(color: Colors.amber)),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      ListTile(leading: const Icon(Icons.volume_up, color: Colors.white), title: const Text("সাউন্ড"), trailing: Switch(value: true, onChanged: (v) {}, activeColor: Colors.amber)),
                      ListTile(leading: const Icon(Icons.vibration, color: Colors.white), title: const Text("ভাইব্রেশন"), trailing: Switch(value: true, onChanged: (v) {}, activeColor: Colors.amber)),
                      const Divider(color: Colors.white24),
                      ListTile(
                        leading: const Icon(Icons.logout, color: Colors.red),
                        title: const Text("লগআউট", style: TextStyle(color: Colors.red)),
                        onTap: () async {
                          final pr = await SharedPreferences.getInstance();
                          await pr.clear();
                          if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const LoginScreen()));
                        },
                      ),
                    ],
                  ),
                ),
              );
            }

            void _openAdmin() {
              final pin = TextEditingController();
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF4A0A3A),
                  title: const Text("অ্যাডমিন পিন", style: TextStyle(color: Colors.amber)),
                  content: TextField(controller: pin, keyboardType: TextInputType.number, obscureText: true, maxLength: 4, textAlign: TextAlign.center, style: const TextStyle(fontSize: 24, letterSpacing: 8)),
                  actions: [
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.amber),
                      onPressed: () {
                        if (pin.text.trim() == masterAdminPin) {
                          Navigator.pop(ctx);
                          Navigator.push(context, MaterialPageRoute(builder: (_) => const AdminScreen()));
                        } else {
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("ভুল পিন!")));
                        }
                      },
                      child: const Text("প্রবেশ", style: TextStyle(color: Colors.black)),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Column(
                    children: [
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                        child: Row(
                          children: [
                            GestureDetector(
                              onTap: _showProfileModal,
                              child: CircleAvatar(backgroundColor: Colors.amber, child: Text(_name.isNotEmpty ? _name[0].toUpperCase() : 'P', style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold))),
                            ),
                            const SizedBox(width: 8),
                            GestureDetector(
                              onTap: () async {
                                await Navigator.push(context, MaterialPageRoute(builder: (_) => WalletScreen(phone: widget.phone, userId: widget.userId, balance: _balance)));
                                _loadData();
                              },
                              child: Container(
                                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                                decoration: BoxDecoration(color: const Color(0xFF35042D), borderRadius: BorderRadius.circular(20), border: Border.all(color: Colors.amber)),
                                child: Row(
                                  children: [
                                    const Icon(Icons.monetization_on, color: Colors.amber, size: 18),
                                    const SizedBox(width: 4),
                                    Text("৳ ${_balance.toStringAsFixed(0)}", style: const TextStyle(fontWeight: FontWeight.bold)),
                                    const SizedBox(width: 4),
                                    const Icon(Icons.add_circle, color: Colors.greenAccent, size: 16),
                                  ],
                                ),
                              ),
                            ),
                            const Spacer(),
                            IconButton(icon: const Icon(Icons.headset_mic, color: Colors.greenAccent), onPressed: () async {
                              final uri = Uri.parse("https://wa.me/8801774229222");
                              if (await canLaunchUrl(uri)) launchUrl(uri, mode: LaunchMode.externalApplication);
                            }),
                            IconButton(icon: const Icon(Icons.security, color: Colors.amber), onPressed: _openAdmin),
                            IconButton(icon: const Icon(Icons.settings, color: Colors.white), onPressed: _showSettingsDialog),
                          ],
                        ),
                      ),
                      Expanded(
                        child: ListView(
                          padding: const EdgeInsets.all(14),
                          children: [
                            _buildModeCard("2 Player Battle", "ক্লাসিক ব্যাটল (৳২০)", Colors.orange.shade800, 20.0),
                            const SizedBox(height: 14),
                            _buildModeCard("4 Player Royal", "রয়্যাল ধামাকা (৳৫০)", Colors.purple.shade800, 50.0),
                            const SizedBox(height: 14),
                            _buildModeCard("Pass N Play", "এক ফোনেই খেলুন (ফ্রি)", Colors.teal.shade800, 0.0),
                            const SizedBox(height: 14),
                            // লিডারবোর্ড বাটন
                            ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF533483), minimumSize: const Size(double.infinity, 48)),
                              icon: const Icon(Icons.leaderboard, color: Colors.amber),
                              label: const Text("লিডারবোর্ড (সেরা খেলোয়াড়)", style: TextStyle(fontWeight: FontWeight.bold)),
                              onPressed: () {
                                Navigator.push(context, MaterialPageRoute(builder: (_) => const LeaderboardScreen()));
                              },
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildModeCard(String title, String sub, Color color, double fee) {
              return GestureDetector(
                onTap: () async {
                  if (fee > 0 && _balance < fee) {
                    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("পর্যাপ্ত ব্যালেন্স নেই!")));
                    return;
                  }
                  await Navigator.push(context, MaterialPageRoute(builder: (_) => RealLudoEngineScreen(entryFee: fee, userId: widget.userId, playerName: _name)));
                  _loadUserData();
                },
                child: Container(
                  height: 110,
                  padding: const EdgeInsets.all(16),
                  decoration: BoxDecoration(color: color, borderRadius: BorderRadius.circular(18), border: Border.all(color: Colors.amber, width: 2)),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisAlignment: MainAxisAlignment.center, children: [
                        Text(title, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.white)),
                        Text(sub, style: const TextStyle(fontSize: 13, color: Colors.white70)),
                      ]),
                      const Icon(Icons.play_circle_fill, size: 45, color: Colors.amberAccent),
                    ],
                  ),
                ),
              );
            }
          }

          // লিডারবোর্ড স্ক্রিন
          class LeaderboardScreen extends StatelessWidget {
            const LeaderboardScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final sb = Supabase.instance.client;
              return Scaffold(
                appBar: AppBar(title: const Text("সেরা লিডারবোর্ড"), backgroundColor: const Color(0xFF4A0A3A)),
                body: StreamBuilder<List<Map<String, dynamic>>>(
                  stream: sb.from('profiles').stream(primaryKey: ['id']).order('matches_won', ascending: false).limit(20),
                  builder: (ctx, s) {
                    if (!s.hasData) return const Center(child: CircularProgressIndicator());
                    final topPlayers = s.data!;
                    if (topPlayers.isEmpty) return const Center(child: Text("কোনো ডেটা নেই"));
                    return ListView.builder(
                      itemCount: topPlayers.length,
                      itemBuilder: (ctx, i) {
                        final tp = topPlayers[i];
                        return Card(
                          color: const Color(0xFF35042D),
                          margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                          child: ListTile(
                            leading: CircleAvatar(backgroundColor: i == 0 ? Colors.amber : (i == 1 ? Colors.grey : Colors.brown), child: Text("${i + 1}", style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold))),
                            title: Text("${tp['full_name']} (${tp['player_id']})", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                            subtitle: Text("জয়: ${tp['matches_won'] ?? 0} টি ম্যাচ", style: const TextStyle(color: Colors.amberAccent)),
                          ),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

          class WalletScreen extends StatefulWidget {
            final String phone;
            final String userId;
            final double balance;
            const WalletScreen({super.key, required this.phone, required this.userId, required this.balance});
            @override
            State<WalletScreen> createState() => _WalletScreenState();
          }

          class _WalletScreenState extends State<WalletScreen> with SingleTickerProviderStateMixin {
            late TabController _tab;
            final _depAmt = TextEditingController();
            final _trxId = TextEditingController();
            final _withAmt = TextEditingController();
            final _withPhone = TextEditingController();
            bool _loading = false;

            @override
            void initState() {
              super.initState();
              _tab = TabController(length: 2, vsync: this);
              _withPhone.text = widget.phone;
            }

            Future<void> _submitDep() async {
              final a = double.tryParse(_depAmt.text) ?? 0;
              final t = _trxId.text.trim();
              if (a < 10 || t.isEmpty) return;
              setState(() => _loading = true);
              try {
                await Supabase.instance.client.from('deposit_requests').insert({'user_id': widget.userId, 'amount': a, 'payment_method': 'BKASH', 'sender_number': widget.phone, 'trx_id': t, 'status': 'PENDING'});
                if (mounted) { Navigator.pop(context); ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("অনুরোধ সফল!"))); }
              } finally { if (mounted) setState(() => _loading = false); }
            }

            Future<void> _submitWith() async {
              final a = double.tryParse(_withAmt.text) ?? 0;
              if (a < 300 || a > widget.balance) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("মিনিমাম উত্তোলন ৩০০ টাকা!")));
                return;
              }
              setState(() => _loading = true);
              try {
                await Supabase.instance.client.from('withdrawal_requests').insert({'user_id': widget.userId, 'amount': a, 'payment_method': 'BKASH', 'receiver_number': _withPhone.text, 'status': 'PENDING'});
