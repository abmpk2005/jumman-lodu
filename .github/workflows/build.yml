name: Build Jumman Ludo Master Edition

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Master Application
        run: |
          flutter create --org com.jumman.ludo --project-name jumman_ludo .
          
          # ১. অ্যান্ড্রয়েড পারমিশন এবং প্যাকেজ কুয়েরি
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n<uses-permission android:name="android.permission.VIBRATE"/>\n<queries>\n<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n<package android:name="com.whatsapp"/>\n<package android:name="org.telegram.messenger"/>\n</queries>' android/app/src/main/AndroidManifest.xml

          # ২. ডিপেন্ডেন্সি কনফিগারেশন
          cat << 'EOF' > pubspec.yaml
          name: jumman_ludo
          description: "Jumman Ludo Master Edition with In-App Updater"
          publish_to: "none"
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            supabase_flutter: ^2.5.0
            google_fonts: ^6.1.0
            intl: ^0.19.0
            shared_preferences: ^2.2.3
            url_launcher: ^6.2.5
          flutter:
            uses-material-design: true
          EOF

          # ৩. সম্পূর্ণ গেম কোড (main.dart)
          cat << 'EOF' > lib/main.dart
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';

          const String supabaseUrl = 'https://tjagciqfcijvszqtsxhr.supabase.co';
          const String supabaseAnonKey = 'sb_publishable_jkd8rKF0gJHgml6kxmOxig_1mWaF7Sm';
          const String masterAdminPin = '7742';
          
          // অ্যাপের বর্তমান লোকাল ভার্সন
          const String currentAppVersion = '1.0.0';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await Supabase.initialize(url: supabaseUrl, anonKey: supabaseAnonKey);
            } catch (_) {}
            runApp(const JummanLudoApp());
          }

          class JummanLudoApp extends StatelessWidget {
            const JummanLudoApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'jumman Ludo',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  textTheme: GoogleFonts.hindSiliguriTextTheme(ThemeData.dark().textTheme),
                  scaffoldBackgroundColor: const Color(0xFF2C0438),
                ),
                home: const SplashScreen(),
              );
            }
          }

          // ১. স্প্ল্যাশ স্ক্রিন ও স্বয়ংক্রিয় আপডেট / মেইনটেন্যান্স চেকার
          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> {
            @override
            void initState() {
              super.initState();
              _checkSystemStatus();
            }

            Future<void> _checkSystemStatus() async {
              await Future.delayed(const Duration(seconds: 2));

              Map<String, dynamic>? config;
              try {
                final supabase = Supabase.instance.client;
                config = await supabase.from('app_config').select().eq('id', 1).maybeSingle();
              } catch (_) {}

              if (!mounted) return;

              // ক. মেইনটেন্যান্স মোড চেক
              if (config != null && config['is_maintenance'] == true) {
                final msg = config['maintenance_message'] ?? "সার্ভারের কাজ চলছে, কিছুক্ষণ পর আসুন।";
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => MaintenanceScreen(message: msg)));
                return;
              }

              // খ. অটো আপডেট চেক
              if (config != null) {
                final latestVer = config['latest_version'] ?? '1.0.0';
                final downloadUrl = config['apk_download_url'] ?? 'https://github.com/abmpk2005/jumman-lodu';

                if (latestVer != currentAppVersion) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => UpdateScreen(downloadUrl: downloadUrl, latestVersion: latestVer)));
                  return;
                }
              }

              // গ. ব্যবহারকারী লগইন চেক
              final prefs = await SharedPreferences.getInstance();
              final phone = prefs.getString('user_phone');
              if (phone != null && phone.isNotEmpty) {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone, config: config)));
              } else {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => LoginScreen(config: config)));
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  width: double.infinity,
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      colors: [Color(0xFF4A0A58), Color(0xFF1F0226)],
                      begin: Alignment.topCenter,
                      end: Alignment.bottomCenter,
                    ),
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          boxShadow: [BoxShadow(color: Colors.amber.withOpacity(0.4), blurRadius: 40, spreadRadius: 10)],
                        ),
                        child: const Icon(Icons.casino, size: 100, color: Color(0xFFFFD700)),
                      ),
                      const SizedBox(height: 16),
                      ShaderMask(
                        shaderCallback: (bounds) => const LinearGradient(colors: [Color(0xFFFFDF00), Color(0xFFFF4500)]).createShader(bounds),
                        child: const Text("JUMMAN LUDO", style: TextStyle(fontSize: 34, fontWeight: FontWeight.w900, color: Colors.white, letterSpacing: 2)),
                      ),
                      const Text("★ MASTER EDITION ★", style: TextStyle(color: Colors.amberAccent, letterSpacing: 3, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 40),
                      const Padding(
                        padding: EdgeInsets.symmetric(horizontal: 50),
                        child: ClipRRect(
                          borderRadius: BorderRadius.all(Radius.circular(20)),
                          child: LinearProgressIndicator(minHeight: 10, backgroundColor: Color(0xFF3B0C46), color: Colors.greenAccent),
                        ),
                      ),
                      const SizedBox(height: 14),
                      const Text("সুরক্ষিত সংযোগ স্থাপন হচ্ছে...", style: TextStyle(color: Colors.white70, fontSize: 13)),
                    ],
                  ),
                ),
              );
            }
          }

          // ২. ইন-অ্যাপ আপডেট স্ক্রিন
          class UpdateScreen extends StatelessWidget {
            final String downloadUrl;
            final String latestVersion;
            const UpdateScreen({super.key, required this.downloadUrl, required this.latestVersion});

            Future<void> _download() async {
              final uri = Uri.parse(downloadUrl);
              if (await canLaunchUrl(uri)) {
                await launchUrl(uri, mode: LaunchMode.externalApplication);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  padding: const EdgeInsets.all(24),
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(colors: [Color(0xFF8B125D), Color(0xFF240428)], begin: Alignment.topCenter, end: Alignment.bottomCenter),
                  ),
                  child: Center(
                    child: Container(
                      padding: const EdgeInsets.all(24),
                      decoration: BoxDecoration(
                        color: const Color(0xFF3A0638),
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(color: Colors.amber, width: 3),
                        boxShadow: const [BoxShadow(color: Colors.black54, blurRadius: 20)],
                      ),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Icon(Icons.system_update_rounded, size: 70, color: Colors.amber),
                          const SizedBox(height: 14),
                          const Text("নতুন আপডেট এসেছে!", style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.white)),
                          const SizedBox(height: 8),
                          Text("ভার্সন v$latestVersion", style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold)),
                          const SizedBox(height: 14),
                          const Text(
                            "গেমটি সুষ্ঠু ও নিরাপদে খেলতে নতুন আপডেট আবশ্যক। এখনই আপডেট করে নতুন ফিচারের আনন্দ নিন।",
                            textAlign: TextAlign.center,
                            style: TextStyle(color: Colors.white70, fontSize: 13),
                          ),
                          const SizedBox(height: 24),
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: Colors.greenAccent.shade700,
                              foregroundColor: Colors.white,
                              minimumSize: const Size(double.infinity, 50),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                            ),
                            icon: const Icon(Icons.download_rounded),
                            label: const Text("এখনই আপডেট করুন", style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                            onPressed: _download,
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // ৩. মেইনটেন্যান্স স্ক্রিন
          class MaintenanceScreen extends StatelessWidget {
            final String message;
            const MaintenanceScreen({super.key, required this.message});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  padding: const EdgeInsets.all(30),
                  color: const Color(0xFF1F0226),
                  child: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.construction_rounded, size: 80, color: Colors.amber),
                        const SizedBox(height: 20),
                        const Text("সার্ভার মেইনটেন্যান্স", style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.white)),
                        const SizedBox(height: 12),
                        Text(message, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white70, fontSize: 14)),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          // ৪. লগইন স্ক্রিন
          class LoginScreen extends StatefulWidget {
            final Map<String, dynamic>? config;
            const LoginScreen({super.key, this.config});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _nameCtrl = TextEditingController();
            final _phoneCtrl = TextEditingController();
            bool _isLoading = false;

            Future<void> _login() async {
              final name = _nameCtrl.text.trim();
              final phone = _phoneCtrl.text.trim();
              if (name.isEmpty || phone.length < 11) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সঠিক নাম ও মোবাইল নম্বর দিন")));
                return;
              }

              setState(() => _isLoading = true);
              try {
                final supabase = Supabase.instance.client;
                final existing = await supabase.from('profiles').select().eq('phone_number', phone).maybeSingle();

                if (existing == null) {
                  final genId = "MIJU${Random().nextInt(8999) + 1000}";
                  final dummyUuid = '00000000-0000-0000-0000-${phone.substring(phone.length - 11)}';
                  await supabase.from('profiles').insert({
                    'id': dummyUuid,
                    'player_id': genId,
                    'full_name': name,
                    'phone_number': phone,
                  });
                  await supabase.from('wallet_accounts').insert({
                    'user_id': dummyUuid,
                    'balance': 50.0,
                  });
                }

                final prefs = await SharedPreferences.getInstance();
                await prefs.setString('user_phone', phone);
                await prefs.setString('user_name', name);

                if (mounted) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone, config: widget.config)));
                }
              } catch (_) {
                final prefs = await SharedPreferences.getInstance();
                await prefs.setString('user_phone', phone);
                await prefs.setString('user_name', name);
                if (mounted) {
                  Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeScreen(phone: phone, config: widget.config)));
                }
              } finally {
                if (mounted) setState(() => _isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(colors: [Color(0xFF4A0A58), Color(0xFF1D0322)], begin: Alignment.topCenter, end: Alignment.bottomCenter),
                  ),
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        children: [
                          const Icon(Icons.stars_rounded, size: 70, color: Colors.amber),
                          const SizedBox(height: 10),
                          const Text("লগইন / নিবন্ধন", style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.white)),
                          const SizedBox(height: 24),
                          TextField(
                            controller: _nameCtrl,
                            style: const TextStyle(color: Colors.white),
                            decoration: InputDecoration(
                              hintText: "আপনার নাম",
                              filled: true,
                              fillColor: const Color(0xFF3D0947),
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(16)),
                              prefixIcon: const Icon(Icons.person, color: Colors.amber),
                            ),
                          ),
                          const SizedBox(height: 14),
                          TextField(
                            controller: _phoneCtrl,
                            keyboardType: TextInputType.phone,
                            style: const TextStyle(color: Colors.white),
                            decoration: InputDecoration(
                              hintText: "মোবাইল নম্বর (১১ ডিজিট)",
                              filled: true,
                              fillColor: const Color(0xFF3D0947),
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(16)),
                              prefixIcon: const Icon(Icons.phone, color: Colors.amber),
                            ),
                          ),
                          const SizedBox(height: 24),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: Colors.amber.shade700,
                              minimumSize: const Size(double.infinity, 50),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                            ),
                            onPressed: _isLoading ? null : _login,
                            child: _isLoading
                                ? const CircularProgressIndicator(color: Colors.white)
                                : const Text("প্রবেশ করুন", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.black)),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // ৫. মূল ড্যাশবোর্ড (Ludo Star স্টাইল + লাইভ নোটিশ)
          class HomeScreen extends StatefulWidget {
            final String phone;
            final Map<String, dynamic>? config;
            const HomeScreen({super.key, required this.phone, this.config});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            double _balance = 0.0;
            String _name = "ভালো ছেলে";
            String _playerId = "MIJU7179";
            final int _level = 25;
            final int _gamesWon = 169;
            final int _totalGames = 337;

            late String _supportNumber;
            late String _notice;

            @override
            void initState() {
              super.initState();
              _supportNumber = widget.config?['support_number'] ?? '01774229222';
              _notice = widget.config?['notice_text'] ?? 'জুমান লুডুতে স্বাগতম! নিয়মিত খেলুন এবং জিতে নিন পুরস্কার।';
              _loadData();
            }

            Future<void> _loadData() async {
              try {
                final supabase = Supabase.instance.client;
                final profile = await supabase.from('profiles').select().eq('phone_number', widget.phone).maybeSingle();
                if (profile != null) {
                  setState(() {
                    _name = profile['full_name'] ?? "ভালো ছেলে";
                    _playerId = profile['player_id'] ?? "MIJU7179";
                  });
                  final wallet = await supabase.from('wallet_accounts').select().eq('user_id', profile['id']).maybeSingle();
                  if (wallet != null) {
                    setState(() {
                      _balance = double.parse((wallet['balance'] ?? 0.0).toString());
                    });
                  }
                }
              } catch (_) {
                final prefs = await SharedPreferences.getInstance();
                setState(() {
                  _name = prefs.getString('user_name') ?? "ভালো ছেলে";
                  _balance = 500.0;
                });
              }
            }

            Future<void> _launchExternalUrl(String url) async {
              final uri = Uri.parse(url);
              try {
                if (await canLaunchUrl(uri)) {
                  await launchUrl(uri, mode: LaunchMode.externalApplication);
                } else {
                  await launchUrl(uri, mode: LaunchMode.externalNonBrowserApplication);
                }
              } catch (_) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("অ্যাপটি ওপেন করা সম্ভব হয়নি।")));
              }
            }

            void _openWhatsApp() {
              final codeNum = _supportNumber.startsWith('0') ? '88$_supportNumber' : _supportNumber;
              final text = Uri.encodeComponent("হ্যালো Jumman Ludo Support, Player ID: $_playerId");
              _launchExternalUrl("https://wa.me/$codeNum?text=$text");
            }

            void _openTelegram() {
              final codeNum = _supportNumber.startsWith('0') ? '88$_supportNumber' : _supportNumber;
              _launchExternalUrl("https://t.me/+$codeNum");
            }

            void _showSupportDialog() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF4A0A3A),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(22), side: const BorderSide(color: Colors.amber, width: 2)),
                  title: const Row(
                    children: [
                      Icon(Icons.headset_mic, color: Colors.greenAccent),
                      SizedBox(width: 10),
                      Text("২৪/৭ হেল্প ও সাপোর্ট", style: TextStyle(color: Colors.white, fontSize: 18)),
                    ],
                  ),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text("ডিপোজিট, উত্তোলন বা যেকোনো প্রয়োজনে সরাসরি যোগাযোগ করুন:", style: TextStyle(color: Colors.white70, fontSize: 13)),
                      const SizedBox(height: 18),
                      ElevatedButton.icon(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFF25D366),
                          foregroundColor: Colors.white,
                          minimumSize: const Size(double.infinity, 50),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                        ),
                        icon: const Icon(Icons.chat, size: 24),
                        label: const Text("WhatsApp-এ চ্যাট করুন", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                        onPressed: () {
                          Navigator.pop(ctx);
                          _openWhatsApp();
                        },
                      ),
                      const SizedBox(height: 14),
                      ElevatedButton.icon(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFF0088CC),
                          foregroundColor: Colors.white,
                          minimumSize: const Size(double.infinity, 50),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                        ),
                        icon: const Icon(Icons.send_rounded, size: 24),
                        label: const Text("Telegram-এ মেসেজ দিন", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                        onPressed: () {
                          Navigator.pop(ctx);
                          _openTelegram();
                        },
                      ),
                    ],
                  ),
                ),
              );
            }

            void _showLudoStarProfileModal() {
              showDialog(
                context: context,
                builder: (ctx) => Dialog(
                  backgroundColor: Colors.transparent,
                  insetPadding: const EdgeInsets.symmetric(horizontal: 18, vertical: 24),
                  child: Container(
                    decoration: BoxDecoration(
                      gradient: const LinearGradient(colors: [Color(0xFF8B125D), Color(0xFF4A0A3A)], begin: Alignment.topCenter, end: Alignment.bottomCenter),
                      borderRadius: BorderRadius.circular(24),
                      border: Border.all(color: const Color(0xFFFFD700), width: 3),
                      boxShadow: const [BoxShadow(color: Colors.black87, blurRadius: 20)],
                    ),
                    child: Stack(
                      children: [
                        Positioned(
                          right: 8,
                          top: 8,
                          child: GestureDetector(
                            onTap: () => Navigator.pop(ctx),
                            child: Container(
                              decoration: const BoxDecoration(shape: BoxShape.circle, color: Colors.red),
                              padding: const EdgeInsets.all(4),
                              child: const Icon(Icons.close, color: Colors.white, size: 20),
                            ),
                          ),
                        ),
                        Padding(
                          padding: const EdgeInsets.all(20),
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Row(
                                children: [
                                  Container(
                                    width: 70,
                                    height: 70,
                                    decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: Colors.amber, width: 3), color: Colors.amber.shade100),
                                    child: const Center(child: Icon(Icons.person, size: 50, color: Color(0xFF4A0A3A))),
                                  ),
                                  const SizedBox(width: 14),
                                  Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(_name, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.white)),
                                      const SizedBox(height: 4),
                                      const Row(
                                        children: [
                                          Text("🇧🇩 ", style: TextStyle(fontSize: 16)),
                                          Text("BANGLADESH", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13)),
                                        ],
                                      ),
                                    ],
                                  ),
                                ],
                              ),
                              const SizedBox(height: 16),
                              Container(
                                width: double.infinity,
                                padding: const EdgeInsets.symmetric(vertical: 12),
                                decoration: BoxDecoration(
                                  color: const Color(0xFF35042D),
                                  borderRadius: BorderRadius.circular(16),
                                  border: Border.all(color: Colors.purpleAccent.withOpacity(0.4)),
                                ),
                                child: const Column(
                                  children: [
                                    Icon(Icons.casino, size: 55, color: Colors.cyanAccent),
                                    SizedBox(height: 4),
