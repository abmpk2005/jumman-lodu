          // ৬. ওয়ালেট স্ক্রিন (ডায়নামিক পার্সোনাল নম্বর সহ)
          class WalletScreen extends StatefulWidget {
            final String phone;
            final double balance;
            final String supportNumber;
            const WalletScreen({super.key, required this.phone, required this.balance, required this.supportNumber});

            @override
            State<WalletScreen> createState() => _WalletScreenState();
          }

          class _WalletScreenState extends State<WalletScreen> with SingleTickerProviderStateMixin {
            late TabController _tabCtrl;
            final _depAmt = TextEditingController();
            final _senderPhone = TextEditingController();
            final _trxId = TextEditingController();
            String _depMethod = 'BKASH';

            final _withAmt = TextEditingController();
            final _withPhone = TextEditingController();
            String _withMethod = 'BKASH';
            bool _loading = false;

            @override
            void initState() {
              super.initState();
              _tabCtrl = TabController(length: 2, vsync: this);
              _senderPhone.text = widget.phone;
              _withPhone.text = widget.phone;
            }

            Future<void> _submitDep() async {
              final amt = double.tryParse(_depAmt.text) ?? 0;
              final trx = _trxId.text.trim();
              if (amt < 10 || trx.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সঠিক পরিমাণ ও TrxID দিন")));
                return;
              }
              setState(() => _loading = true);
              try {
                final supabase = Supabase.instance.client;
                final profile = await supabase.from('profiles').select().eq('phone_number', widget.phone).single();
                await supabase.from('deposit_requests').insert({
                  'user_id': profile['id'],
                  'amount': amt,
                  'payment_method': _depMethod,
                  'sender_number': _senderPhone.text,
                  'trx_id': trx,
                  'status': 'PENDING',
                });
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("ডিপোজিট অনুরোধ পাঠানো হয়েছে!")));
                  Navigator.pop(context);
                }
              } catch (_) {
                if (mounted) Navigator.pop(context);
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            Future<void> _submitWith() async {
              final amt = double.tryParse(_withAmt.text) ?? 0;
              if (amt < 50 || amt > widget.balance) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("সর্বনিম্ন ৫০ টাকা উত্তোলনযোগ্য")));
                return;
              }
              setState(() => _loading = true);
              try {
                final supabase = Supabase.instance.client;
                final profile = await supabase.from('profiles').select().eq('phone_number', widget.phone).single();
                await supabase.from('withdrawal_requests').insert({
                  'user_id': profile['id'],
                  'amount': amt,
                  'payment_method': _withMethod,
                  'receiver_number': _withPhone.text,
                  'status': 'PENDING',
                });
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("উত্তোলন অনুরোধ সফল হয়েছে!")));
                  Navigator.pop(context);
                }
              } catch (_) {
                if (mounted) Navigator.pop(context);
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text("ওয়ালেট ও লেনদেন"),
                  backgroundColor: const Color(0xFF4A0A3A),
                  bottom: TabBar(
                    controller: _tabCtrl,
                    indicatorColor: Colors.amber,
                    tabs: const [Tab(text: "টাকা জমা (Deposit)"), Tab(text: "উত্তোলন (Withdraw)")],
                  ),
                ),
                body: TabBarView(
                  controller: _tabCtrl,
                  children: [
                    SingleChildScrollView(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          Container(
                            padding: const EdgeInsets.all(14),
                            decoration: BoxDecoration(color: const Color(0xFF35042D), borderRadius: BorderRadius.circular(14), border: Border.all(color: Colors.amber)),
                            child: Column(
                              children: [
                                const Text("Send Money নম্বর (বিকাশ / নগদ পার্সোনাল):", style: TextStyle(color: Colors.white70)),
                                const SizedBox(height: 4),
                                Text(widget.supportNumber, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.amber)),
                              ],
                            ),
                          ),
                          const SizedBox(height: 16),
                          DropdownButtonFormField<String>(
                            value: _depMethod,
                            dropdownColor: const Color(0xFF35042D),
                            decoration: const InputDecoration(labelText: "পেমেন্ট মেথড", filled: true, fillColor: Color(0xFF35042D)),
                            items: const [DropdownMenuItem(value: 'BKASH', child: Text("বিকাশ")), DropdownMenuItem(value: 'NAGAD', child: Text("নগদ"))],
                            onChanged: (v) => setState(() => _depMethod = v!),
                          ),
                          const SizedBox(height: 10),
                          TextField(controller: _depAmt, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "টাকার পরিমাণ", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 10),
                          TextField(controller: _trxId, decoration: const InputDecoration(labelText: "Transaction ID (TrxID)", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 20),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, minimumSize: const Size(double.infinity, 48)),
                            onPressed: _loading ? null : _submitDep,
                            child: const Text("জমা দিন", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                          ),
                        ],
                      ),
                    ),
                    SingleChildScrollView(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          TextField(controller: _withAmt, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "উত্তোলনের পরিমাণ", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 10),
                          TextField(controller: _withPhone, keyboardType: TextInputType.phone, decoration: const InputDecoration(labelText: "বিকাশ/নগদ নম্বর", filled: true, fillColor: Color(0xFF35042D))),
                          const SizedBox(height: 20),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.greenAccent, minimumSize: const Size(double.infinity, 48)),
                            onPressed: _loading ? null : _submitWith,
                            child: const Text("উত্তোলন করুন", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          // ৭. অ্যাডমিন প্যানেল
          class AdminScreen extends StatelessWidget {
            const AdminScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final supabase = Supabase.instance.client;
              return Scaffold(
                appBar: AppBar(title: const Text("অ্যাডমিন ডিপোজিট কন্ট্রোল"), backgroundColor: const Color(0xFF4A0A3A)),
                body: StreamBuilder<List<Map<String, dynamic>>>(
                  stream: supabase.from('deposit_requests').stream(primaryKey: ['id']).eq('status', 'PENDING'),
                  builder: (context, snapshot) {
                    if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                    final list = snapshot.data!;
                    if (list.isEmpty) return const Center(child: Text("কোনো পেন্ডিং ট্রানজেকশন নেই!"));

                    return ListView.builder(
                      itemCount: list.length,
                      itemBuilder: (context, i) {
                        final req = list[i];
                        return Card(
                          color: const Color(0xFF35042D),
                          margin: const EdgeInsets.all(8),
                          child: ListTile(
                            title: Text("৳${req['amount']} (${req['payment_method']})", style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                            subtitle: Text("প্রেরক: ${req['sender_number']}\nTrxID: ${req['trx_id']}"),
                            trailing: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                IconButton(
                                  icon: const Icon(Icons.check_circle, color: Colors.green, size: 28),
                                  onPressed: () async {
                                    await supabase.rpc('approve_deposit_transaction', params: {
                                      'p_req_id': req['id'],
                                      'p_user_id': req['user_id'],
                                      'p_amount': req['amount'],
                                    });
                                  },
                                ),
                                IconButton(
                                  icon: const Icon(Icons.cancel, color: Colors.red, size: 28),
                                  onPressed: () async {
                                    await supabase.from('deposit_requests').update({'status': 'REJECTED'}).eq('id', req['id']);
                                  },
                                ),
                              ],
                            ),
                          ),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

          // ৮. লুডু বোর্ড ইঞ্জিন
          class LudoGameScreen extends StatefulWidget {
            final double entryFee;
            const LudoGameScreen({super.key, required this.entryFee});
            @override
            State<LudoGameScreen> createState() => _LudoGameScreenState();
          }

          class _LudoGameScreenState extends State<LudoGameScreen> {
            int _dice = 1;
            bool _rolling = false;
            int _turn = 0;
            List<int> red = [-1, -1, -1, -1];
            List<int> green = [-1, -1, -1, -1];

            void _roll() {
              if (_rolling) return;
              setState(() => _rolling = true);
              Future.delayed(const Duration(milliseconds: 400), () {
                setState(() {
                  _dice = Random().nextInt(6) + 1;
                  _rolling = false;
                  if (_turn == 0) {
                    _move(red);
                    if (_dice != 6) {
                      _turn = 1;
                      Future.delayed(const Duration(milliseconds: 1000), () => _roll());
                    }
                  } else {
                    _move(green);
                    if (_dice != 6) {
                      _turn = 0;
                    } else {
                      Future.delayed(const Duration(milliseconds: 1000), () => _roll());
                    }
                  }
                });
              });
            }

            void _move(List<int> tokens) {
              for (int i = 0; i < 4; i++) {
                if (tokens[i] == -1 && _dice == 6) {
                  tokens[i] = 0;
                  break;
                } else if (tokens[i] >= 0 && tokens[i] < 57) {
                  tokens[i] = min(57, tokens[i] + _dice);
                  break;
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text("ম্যাচ - ফি: ৳${widget.entryFee.toInt()}"), backgroundColor: const Color(0xFF4A0A3A)),
                body: Column(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Row(
                        children: [
                          const CircleAvatar(backgroundColor: Colors.green, radius: 14),
                          const SizedBox(width: 8),
                          Text("প্রতিপক্ষ (সবুজ) ${_turn == 1 ? '— ভাবছেন...' : ''}", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                        ],
                      ),
                    ),
                    AspectRatio(
                      aspectRatio: 1.0,
                      child: Container(
                        margin: const EdgeInsets.all(8),
                        decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(14), border: Border.all(color: Colors.amber, width: 3)),
                        child: CustomPaint(painter: LudoBoardPainter(redTokens: red, greenTokens: green)),
                      ),
                    ),
                    Container(
                      padding: const EdgeInsets.all(16),
                      color: const Color(0xFF35042D),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Row(
                            children: [
                              const CircleAvatar(backgroundColor: Colors.red, radius: 14),
                              const SizedBox(width: 8),
                              Text("আপনার চাল (লাল) ${_turn == 0 ? '— চালুন!' : ''}", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                            ],
                          ),
                          GestureDetector(
                            onTap: (_turn == 0 && !_rolling) ? _roll : null,
                            child: Container(
                              width: 60,
                              height: 60,
                              decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.red, width: 3)),
                              child: Center(
                                child: _rolling
                                    ? const SizedBox(width: 24, height: 24, child: CircularProgressIndicator(color: Colors.red))
                                    : Text("$_dice", style: const TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.black)),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class LudoBoardPainter extends CustomPainter {
            final List<int> redTokens;
            final List<int> greenTokens;
            LudoBoardPainter({required this.redTokens, required this.greenTokens});

            @override
            void paint(Canvas canvas, Size size) {
              final step = size.width / 15;
              final paint = Paint()..style = PaintingStyle.fill;

              paint.color = Colors.red.shade600;
              canvas.drawRect(Rect.fromLTWH(0, 0, step * 6, step * 6), paint);
              paint.color = Colors.green.shade600;
              canvas.drawRect(Rect.fromLTWH(step * 9, 0, step * 6, step * 6), paint);
              paint.color = Colors.blue.shade600;
              canvas.drawRect(Rect.fromLTWH(0, step * 9, step * 6, step * 6), paint);
              paint.color = Colors.amber.shade600;
              canvas.drawRect(Rect.fromLTWH(step * 9, step * 9, step * 6, step * 6), paint);

              final border = Paint()..style = PaintingStyle.stroke..color = Colors.black26..strokeWidth = 1;
              for (int r = 0; r < 15; r++) {
                for (int c = 0; c < 15; c++) {
                  canvas.drawRect(Rect.fromLTWH(c * step, r * step, step, step), border);
                }
              }

              final token = Paint()..style = PaintingStyle.fill;
              token.color = Colors.red;
              for (var t in redTokens) {
                if (t >= 0) canvas.drawCircle(Offset(step * (1.5 + (t % 12)), step * 7.5), step * 0.4, token);
              }
              token.color = Colors.green;
              for (var t in greenTokens) {
                if (t >= 0) canvas.drawCircle(Offset(step * (13.5 - (t % 12)), step * 7.5), step * 0.4, token);
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

