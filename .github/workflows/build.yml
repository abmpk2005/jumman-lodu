          // ৫. অ্যাডমিন প্যানেল
          class AdminScreen extends StatelessWidget {
            const AdminScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final supabase = Supabase.instance.client;
              return Scaffold(
                appBar: AppBar(title: const Text("অ্যাডমিন ট্রানজেকশন কন্ট্রোল"), backgroundColor: const Color(0xFF1E293B)),
                body: StreamBuilder<List<Map<String, dynamic>>>(
                  stream: supabase.from('deposit_requests').stream(primaryKey: ['id']).eq('status', 'PENDING'),
                  builder: (context, snapshot) {
                    if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                    final requests = snapshot.data!;
                    if (requests.isEmpty) {
                      return const Center(child: Text("কোনো পেন্ডিং ডিপোজিট অনুরোধ নেই!", style: TextStyle(color: Colors.white70)));
                    }

                    return ListView.builder(
                      itemCount: requests.length,
                      itemBuilder: (context, i) {
                        final req = requests[i];
                        return Card(
                          color: const Color(0xFF1E293B),
                          margin: const EdgeInsets.all(8),
                          child: ListTile(
                            title: Text("পরিমাণ: ৳${req['amount']} (${req['payment_method']})", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.greenAccent)),
                            subtitle: Text("প্রেরক: ${req['sender_number']}\nTrxID: ${req['trx_id']}", style: const TextStyle(color: Colors.white70)),
                            trailing: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                IconButton(
                                  icon: const Icon(Icons.check_circle, color: Colors.green, size: 30),
                                  onPressed: () async {
                                    await supabase.rpc('approve_deposit_transaction', params: {
                                      'p_req_id': req['id'],
                                      'p_user_id': req['user_id'],
                                      'p_amount': req['amount'],
                                    });
                                  },
                                ),
                                IconButton(
                                  icon: const Icon(Icons.cancel, color: Colors.red, size: 30),
                                  onPressed: () async {
                                    await supabase.from('deposit_requests').update({'status': 'REJECTED'}).eq('id', req['id']);
                                  },
                                ),
                              ],
                            ),
                          ),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

          // ৬. পূর্ণাঙ্গ লুডু গেম বোর্ড ও ইঞ্জিন
          class LudoGameScreen extends StatefulWidget {
            final double entryFee;
            const LudoGameScreen({super.key, required this.entryFee});
            @override
            State<LudoGameScreen> createState() => _LudoGameScreenState();
          }

          class _LudoGameScreenState extends State<LudoGameScreen> {
            int _dice = 1;
            bool _isRolling = false;
            int _turn = 0;
            
            List<int> redTokens = [-1, -1, -1, -1];
            List<int> greenTokens = [-1, -1, -1, -1];

            void _rollDice() {
              if (_isRolling) return;
              setState(() => _isRolling = true);

              Future.delayed(const Duration(milliseconds: 400), () {
                setState(() {
                  _dice = Random().nextInt(6) + 1;
                  _isRolling = false;
                  
                  if (_turn == 0) {
                    _autoMoveRed();
                  } else {
                    _autoMoveGreen();
                  }
                });
              });
            }

            void _autoMoveRed() {
              for (int i = 0; i < 4; i++) {
                if (redTokens[i] == -1 && _dice == 6) {
                  redTokens[i] = 0;
                  break;
                } else if (redTokens[i] >= 0 && redTokens[i] < 57) {
                  redTokens[i] = min(57, redTokens[i] + _dice);
                  break;
                }
              }

              if (_dice != 6) {
                _turn = 1;
                Future.delayed(const Duration(milliseconds: 1000), () => _rollDice());
              }
            }

            void _autoMoveGreen() {
              for (int i = 0; i < 4; i++) {
                if (greenTokens[i] == -1 && _dice == 6) {
                  greenTokens[i] = 0;
                  break;
                } else if (greenTokens[i] >= 0 && greenTokens[i] < 57) {
                  greenTokens[i] = min(57, greenTokens[i] + _dice);
                  break;
                }
              }

              if (_dice != 6) {
                _turn = 0;
              } else {
                Future.delayed(const Duration(milliseconds: 1000), () => _rollDice());
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text("ম্যাচ - ফি: ৳${widget.entryFee.toStringAsFixed(0)}"),
                  backgroundColor: const Color(0xFF1E293B),
                ),
                body: Column(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Row(
                        children: [
                          const CircleAvatar(backgroundColor: Colors.green, radius: 14),
                          const SizedBox(width: 8),
                          Text("প্রতিপক্ষ (সবুজ) ${_turn == 1 ? '— ভাবছেন...' : ''}", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                        ],
                      ),
                    ),
                    AspectRatio(
                      aspectRatio: 1.0,
                      child: Container(
                        margin: const EdgeInsets.all(8),
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(12),
                          border: Border.all(color: Colors.amber, width: 3),
                        ),
                        child: CustomPaint(
                          painter: LudoBoardPainter(redTokens: redTokens, greenTokens: greenTokens),
                        ),
                      ),
                    ),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 14),
                      color: const Color(0xFF1E293B),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Row(
                            children: [
                              const CircleAvatar(backgroundColor: Colors.red, radius: 14),
                              const SizedBox(width: 8),
                              Text("আপনার চাল (লাল) ${_turn == 0 ? '— চাল দিন!' : ''}", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                            ],
                          ),
                          GestureDetector(
                            onTap: (_turn == 0 && !_isRolling) ? _rollDice : null,
                            child: Container(
                              width: 60,
                              height: 60,
                              decoration: BoxDecoration(
                                color: Colors.white,
                                borderRadius: BorderRadius.circular(12),
                                border: Border.all(color: Colors.red, width: 3),
                              ),
                              child: Center(
                                child: _isRolling
                                    ? const SizedBox(width: 24, height: 24, child: CircularProgressIndicator(color: Colors.red, strokeWidth: 3))
                                    : Text("$_dice", style: const TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.black)),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class LudoBoardPainter extends CustomPainter {
            final List<int> redTokens;
            final List<int> greenTokens;

            LudoBoardPainter({required this.redTokens, required this.greenTokens});

            @override
            void paint(Canvas canvas, Size size) {
              final step = size.width / 15;
              final paint = Paint()..style = PaintingStyle.fill;

              paint.color = Colors.red.shade600;
              canvas.drawRect(Rect.fromLTWH(0, 0, step * 6, step * 6), paint);

              paint.color = Colors.green.shade600;
              canvas.drawRect(Rect.fromLTWH(step * 9, 0, step * 6, step * 6), paint);

              paint.color = Colors.blue.shade600;
              canvas.drawRect(Rect.fromLTWH(0, step * 9, step * 6, step * 6), paint);

              paint.color = Colors.amber.shade600;
              canvas.drawRect(Rect.fromLTWH(step * 9, step * 9, step * 6, step * 6), paint);

              final borderPaint = Paint()..style = PaintingStyle.stroke..color = Colors.black26..strokeWidth = 1;
              for (int r = 0; r < 15; r++) {
                for (int c = 0; c < 15; c++) {
                  canvas.drawRect(Rect.fromLTWH(c * step, r * step, step, step), borderPaint);
                }
              }

              final tokenPaint = Paint()..style = PaintingStyle.fill;
              tokenPaint.color = Colors.red;
              for (var t in redTokens) {
                if (t >= 0) {
                  canvas.drawCircle(Offset(step * (1.5 + (t % 12)), step * 7.5), step * 0.4, tokenPaint);
                }
              }

              tokenPaint.color = Colors.green;
              for (var t in greenTokens) {
                if (t >= 0) {
                  canvas.drawCircle(Offset(step * (13.5 - (t % 12)), step * 7.5), step * 0.4, tokenPaint);
                }
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
