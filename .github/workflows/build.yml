                body: TabBarView(
                  controller: _tab,
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          Container(
                            padding: const EdgeInsets.all(12),
                            decoration: BoxDecoration(color: const Color(0xFF35042D), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.amber)),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Text("বিকাশ/নগদ: 01774229222", style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.amber)),
                                // 📋 ১-ক্লিক নম্বর কপি বাটন
